name: Full hosted Safari product diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari-product-diagnostic:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      SAFARI_BIN: ${{ github.workspace }}/tools/qualification/safari-launch.sh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check clean checkout and exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Select pinned Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Safari lifecycle trace
        run: mkdir -m 700 "$RUNNER_TEMP/safari-event-trace"

      - name: Run full hosted Safari product diagnostic
        id: safari_product_diagnostic
        env:
          DYN4K_SAFARI_EVENT_TRACE_DIR: ${{ runner.temp }}/safari-event-trace
        run: >-
          python -B tools/qualification/full_hosted.py
          --candidate-sha "$GITHUB_SHA"
          --target jsSafari
          --output "$RUNNER_TEMP/full-hosted-jsSafari"

      - name: Package full hosted raw evidence
        id: package_failed_evidence
        if: always()
        run: >-
          python -B tools/qualification/full_hosted.py --package
          --output "$RUNNER_TEMP/full-hosted-jsSafari"
          --archive "$RUNNER_TEMP/full-hosted-jsSafari.tar"

      - name: Write diagnostic job receipt
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.safari_product_diagnostic.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package_failed_evidence.outcome }}
        run: |
          printf '{\n  "candidate_sha": "%s",\n  "run_id": "%s",\n  "run_attempt": "%s",\n  "target": "jsSafari",\n  "full_hosted_outcome": "%s",\n  "package_outcome": "%s"\n}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$DIAGNOSTIC_OUTCOME" "$PACKAGE_OUTCOME" \
            > "$RUNNER_TEMP/full-hosted-jsSafari-job-receipt.json"

      - name: Upload Safari diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-hosted-jsSafari-product-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/full-hosted-jsSafari.tar
            ${{ runner.temp }}/full-hosted-jsSafari-job-receipt.json
            ${{ runner.temp }}/safari-event-trace/
          if-no-files-found: warn
