name: Native host short performance producer

on:
  workflow_dispatch:
    inputs:
      target:
        description: Matching Native host target
        type: choice
        required: true
        options:
          - macosArm64
          - mingwX64
      build:
        description: Consumer link mode
        type: choice
        required: true
        options:
          - development
          - optimized

permissions:
  contents: read

jobs:
  capture:
    runs-on: ${{ inputs.target == 'macosArm64' && 'macos-26' || 'windows-2025' }}
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: ${{ inputs.target == 'macosArm64' && '/Applications/Xcode_26.4.1.app/Contents/Developer' || '' }}
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET: ${{ inputs.target }}
      BUILD: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Stage and capture on selected host
        shell: bash
        run: python -B "$GITHUB_WORKSPACE/tools/performance/sustained_portable/native_hosted_short_runner.py"
      - name: Upload raw Native host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-native-host-short-${{ github.sha }}-${{ inputs.target }}-${{ inputs.build }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/performance-native-host-short/
            ${{ github.workspace }}/build/staging-repository/
          include-hidden-files: true
          if-no-files-found: warn
