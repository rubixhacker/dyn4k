name: Diagnostic publication hidden-file transport

on:
  workflow_dispatch:

jobs:
  transport:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare checked publication fixture
        id: fixture
        run: >-
          python3 tools/qualification/diagnostic_publication_transport.py prepare
          --candidate-sha "$GITHUB_SHA"
      - name: Upload hosted publication bytes
        uses: actions/upload-artifact@v4
        with:
          name: publication-transport-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hosted-publication/
            ${{ runner.temp }}/artifact-audit.json
            build/staging-repository/.qualification/windows/
          include-hidden-files: true
          if-no-files-found: error
      - name: Download hosted publication bytes
        uses: actions/download-artifact@v4
        with:
          name: publication-transport-${{ github.sha }}
          path: ${{ runner.temp }}/downloaded/
      - name: Verify downloaded publication
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.fixture.outputs.manifest_sha256 }}
        run: >-
          python3 tools/qualification/diagnostic_publication_transport.py verify
          --candidate-sha "$GITHUB_SHA"
