name: Staged qualification evidence

on:
  workflow_dispatch:
    inputs:
      windows_diagnostics:
        description: Run only Windows native and publication diagnostics
        type: boolean
        required: false
        default: false
  push:
    branches:
      - codex/port-qualification-harness
      - codex/dyn4k-port
      - codex/port-publication-assembly
  pull_request:

jobs:
  staged-jvm-and-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.windows_diagnostics != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Harness regression tests
        run: python3 -m unittest discover -s tools/qualification -p 'test_*.py' -v
      - name: Stage all target publications
        run: >-
          python3 tools/qualification/stage.py
          --candidate-sha "$GITHUB_SHA"
          --target jvm --target android --target js
          --target wasmJs --target wasmWasi
          --target linuxX64 --target linuxArm64
          --target androidNativeArm32 --target androidNativeArm64
          --target androidNativeX86 --target androidNativeX64
          --target mingwX64 --target macosArm64
          --target iosArm64 --target iosSimulatorArm64 --target iosX64
          --target tvosArm64 --target tvosSimulatorArm64
          --target watchosArm64 --target watchosDeviceArm64
          --target watchosSimulatorArm64
          --output build/staging-repository/.qualification/ubuntu/receipt.json
          --console build/staging-repository/.qualification/ubuntu/stage.log
      - name: Execute staged Kotlin and Java consumer
        run: >-
          ./gradlew -p consumers/qualification --no-daemon --console=plain run
          -PqualificationRepository="$GITHUB_WORKSPACE/build/staging-repository"
      - name: Reject duplicate provider
        run: |
          if ./gradlew -p consumers/qualification --no-daemon --console=plain verifySingleProvider -PqualificationRepository="$GITHUB_WORKSPACE/build/staging-repository" -PwithUpstream=true > "$RUNNER_TEMP/provider.log" 2>&1; then
            cat "$RUNNER_TEMP/provider.log"
            exit 1
          fi
          grep -F 'duplicate org.dyn4j provider' "$RUNNER_TEMP/provider.log"
      - name: Execute staged portable host consumers
        run: >-
          python3 tools/qualification/qualify.py probe
          --candidate-sha "$GITHUB_SHA"
          --manifest tools/qualification/foundation-probes.json
          --group consumer-jvm --group consumer-linuxX64
          --group consumer-jsNode --group consumer-wasmJsNode
          --group consumer-wasmWasiNode --group consumer-androidHost
          --report 'consumers/qualification/portable/build/test-results/jvmTest/TEST-*.xml'
          --report 'consumers/qualification/portable/build/test-results/linuxX64Test/TEST-*.xml'
          --report 'consumers/qualification/portable/build/test-results/jsNodeTest/TEST-*.xml'
          --report 'consumers/qualification/portable/build/test-results/wasmJsNodeTest/TEST-*.xml'
          --report 'consumers/qualification/portable/build/test-results/wasmWasiNodeTest/TEST-*.xml'
          --report 'consumers/qualification/portable/build/test-results/testAndroidHostTest/TEST-*.xml'
          --output "$RUNNER_TEMP/portable-consumer-probe.json"
          -- ./gradlew -p consumers/qualification/portable --no-daemon --console=plain
          jvmTest linuxX64Test jsNodeTest wasmJsNodeTest wasmWasiNodeTest testAndroidHostTest
          -PqualificationRepository="$GITHUB_WORKSPACE/build/staging-repository"
      - name: Run available foundation JVM and Linux tests
        run: >-
          python3 tools/qualification/qualify.py probe
          --candidate-sha "$GITHUB_SHA"
          --manifest tools/qualification/foundation-probes.json
          --group core-jvm --group jvm --group core-linuxX64 --group linuxX64
          --report 'dyn4k-core/build/test-results/jvmTest/TEST-*.xml'
          --report 'dyn4k/build/test-results/jvmTest/TEST-*.xml'
          --report 'dyn4k-core/build/test-results/linuxX64Test/TEST-*.xml'
          --report 'dyn4k/build/test-results/linuxX64Test/TEST-*.xml'
          --output "$RUNNER_TEMP/foundation-probe.json"
          -- ./gradlew --no-daemon --console=plain
          :dyn4k-core:jvmTest :dyn4k:jvmTest
          :dyn4k-core:linuxX64Test :dyn4k:linuxX64Test
      - name: Run available foundation JS and Wasm tests
        run: >-
          python3 tools/qualification/qualify.py probe
          --candidate-sha "$GITHUB_SHA"
          --manifest tools/qualification/foundation-probes.json
          --group core-jsNode --group jsNode
          --group core-wasmJsNode --group wasmJsNode
          --group core-wasmWasiNode --group wasmWasiNode
          --report 'dyn4k-core/build/test-results/jsNodeTest/TEST-*.xml'
          --report 'dyn4k/build/test-results/jsNodeTest/TEST-*.xml'
          --report 'dyn4k-core/build/test-results/wasmJsNodeTest/TEST-*.xml'
          --report 'dyn4k/build/test-results/wasmJsNodeTest/TEST-*.xml'
          --report 'dyn4k-core/build/test-results/wasmWasiNodeTest/TEST-*.xml'
          --report 'dyn4k/build/test-results/wasmWasiNodeTest/TEST-*.xml'
          --output "$RUNNER_TEMP/web-probe.json"
          -- ./gradlew --no-daemon --console=plain
          :dyn4k-core:jsNodeTest :dyn4k:jsNodeTest
          :dyn4k-core:wasmJsNodeTest :dyn4k:wasmJsNodeTest
          :dyn4k-core:wasmWasiNodeTest :dyn4k:wasmWasiNodeTest
      - name: Run Android host foundation test
        run: >-
          python3 tools/qualification/qualify.py probe
          --candidate-sha "$GITHUB_SHA"
          --manifest tools/qualification/foundation-probes.json
          --group core-androidHost --group androidHost
          --report 'dyn4k-core/build/test-results/testAndroidHostTest/TEST-*.xml'
          --report 'dyn4k/build/test-results/testAndroidHostTest/TEST-*.xml'
          --output "$RUNNER_TEMP/android-host-probe.json"
          -- ./gradlew --no-daemon --console=plain
          :dyn4k-core:testAndroidHostTest :dyn4k:testAndroidHostTest
      - name: Audit staged artifact contract
        if: always()
        run: >-
          python3 tools/qualification/qualify.py audit-staging
          --candidate-sha "$GITHUB_SHA"
          --repository build/staging-repository
          --target jvm --target android --target js
          --target wasmJs --target wasmWasi
          --target linuxX64 --target linuxArm64
          --target androidNativeArm32 --target androidNativeArm64
          --target androidNativeX86 --target androidNativeX64
          --target mingwX64 --target macosArm64
          --target iosArm64 --target iosSimulatorArm64 --target iosX64
          --target tvosArm64 --target tvosSimulatorArm64
          --target watchosArm64 --target watchosDeviceArm64
          --target watchosSimulatorArm64
          --stage-receipt build/staging-repository/.qualification/ubuntu/receipt.json
          --stage-console build/staging-repository/.qualification/ubuntu/stage.log
          --output "$RUNNER_TEMP/artifact-audit.json"
      - name: Package Linux publication evidence
        if: always()
        run: >-
          python3 tools/qualification/publication.py package
          --candidate-sha "$GITHUB_SHA"
          --audit "$RUNNER_TEMP/artifact-audit.json"
          --output "$RUNNER_TEMP/ubuntu-publication"
      - name: Record every required runtime lane
        if: always()
        run: >-
          python3 tools/qualification/qualify.py record
          --candidate-sha "$GITHUB_SHA"
          --output "$RUNNER_TEMP/runtime-matrix.json"
      - name: Verify and package Ubuntu raw evidence
        if: always()
        run: >-
          python3 tools/qualification/artifact.py ubuntu
          --candidate-sha "$GITHUB_SHA"
          --evidence-dir "$RUNNER_TEMP"
          --output "$RUNNER_TEMP/ubuntu-raw-bundle"
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ubuntu-raw-bundle/
          if-no-files-found: error
      - name: Upload Linux publication bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ github.sha }}-ubuntu
          path: |
            ${{ runner.temp }}/ubuntu-publication/
            ${{ runner.temp }}/artifact-audit.json
            build/staging-repository/.qualification/ubuntu/
          if-no-files-found: error

  hosted-publications:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.windows_diagnostics == true && github.event_name == 'workflow_dispatch' && '{"include":[{"host":"windows","runner":"windows-2025","targets":"--target mingwX64"}]}' || '{"include":[{"host":"macos","runner":"macos-26","targets":"--target macosArm64 --target iosArm64 --target iosSimulatorArm64 --target iosX64 --target tvosArm64 --target tvosSimulatorArm64 --target watchosArm64 --target watchosDeviceArm64 --target watchosSimulatorArm64"},{"host":"windows","runner":"windows-2025","targets":"--target mingwX64"}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Harness regression tests
        run: |
          if [[ "${{ matrix.host }}" == windows ]]; then
            diagnostics="$RUNNER_TEMP/windows-publication-diagnostics"
            mkdir -p "$diagnostics/logs"
            set +e
            python -m unittest discover -s tools/qualification -p 'test_*.py' -v \
              > "$diagnostics/harness.stdout" 2> "$diagnostics/harness.stderr"
            result=$?
            set -e
            printf '%s\n' "$result" > "$diagnostics/harness.exit-code"
            exit "$result"
          else
            python -m unittest discover -s tools/qualification -p 'test_*.py' -v
          fi
      - name: Stage hosted publications
        run: >-
          python tools/qualification/stage.py
          --candidate-sha "${{ github.sha }}"
          ${{ matrix.targets }}
          --output "build/staging-repository/.qualification/${{ matrix.host }}/receipt.json"
          --console "build/staging-repository/.qualification/${{ matrix.host }}/stage.log"
      - name: Audit hosted publications
        if: always()
        run: >-
          python tools/qualification/qualify.py audit-staging
          --candidate-sha "${{ github.sha }}"
          --repository build/staging-repository
          ${{ matrix.targets }}
          --stage-receipt "build/staging-repository/.qualification/${{ matrix.host }}/receipt.json"
          --stage-console "build/staging-repository/.qualification/${{ matrix.host }}/stage.log"
          --output "${{ runner.temp }}/artifact-audit.json"
      - name: Package hosted publication evidence
        if: always()
        run: >-
          python tools/qualification/publication.py package
          --candidate-sha "${{ github.sha }}"
          --audit "${{ runner.temp }}/artifact-audit.json"
          --output "${{ runner.temp }}/hosted-publication"
      - name: Upload hosted publication bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ github.sha }}-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/hosted-publication/
            ${{ runner.temp }}/artifact-audit.json
            build/staging-repository/.qualification/${{ matrix.host }}/
          if-no-files-found: error
      - name: Collect Windows publication logs
        if: always() && matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/windows-publication-diagnostics"
          mkdir -p "$diagnostics/logs"
          errors="$diagnostics/logs/collection-errors.txt"
          missing=0
          if [[ -f build/staging-repository/.qualification/windows/stage.log ]]; then
            cp -- build/staging-repository/.qualification/windows/stage.log "$diagnostics/logs/stage.log"
          else
            printf '%s\n' 'Missing expected Windows publication stage log.' >> "$errors"
            missing=1
          fi
          gradle_home="$(cygpath -u "${GRADLE_USER_HOME:-$HOME/.gradle}")"
          gradle_manifest="$RUNNER_TEMP/windows-publication-gradle-files"
          if [[ -d "$gradle_home/daemon" ]]; then
            (cd "$gradle_home" && find daemon -type f -name '*.out.log' -print0) > "$gradle_manifest"
            if [[ -s "$gradle_manifest" ]]; then
              mkdir -p "$diagnostics/logs/gradle-user-home"
              (
                cd "$gradle_home"
                while IFS= read -r -d '' relative; do
                  cp --parents -- "$relative" "$diagnostics/logs/gradle-user-home"
                done < "$gradle_manifest"
              )
            else
              printf 'No Gradle daemon logs found under %s/daemon.\n' "$gradle_home" >> "$errors"
              missing=1
            fi
          else
            printf 'Missing expected Gradle daemon directory: %s/daemon\n' "$gradle_home" >> "$errors"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            cat "$errors" >&2
            exit 1
          fi
      - name: Upload Windows publication logs
        if: always() && matrix.host == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-raw-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.host }}
          path: ${{ runner.temp }}/windows-publication-diagnostics/
          if-no-files-found: warn

  hosted-native:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.windows_diagnostics == true && github.event_name == 'workflow_dispatch' && '{"include":[{"target":"mingwX64","runner":"windows-2025"}]}' || '{"include":[{"target":"macosArm64","runner":"macos-26"},{"target":"iosSimulatorArm64","runner":"macos-26"},{"target":"tvosSimulatorArm64","runner":"macos-26"},{"target":"watchosSimulatorArm64","runner":"macos-26"},{"target":"iosX64","runner":"macos-26-intel"},{"target":"mingwX64","runner":"windows-2025"}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute staged native host probe
        run: >-
          python tools/qualification/hosted.py run
          --candidate-sha "${{ github.sha }}"
          --target "${{ matrix.target }}"
          --output "${{ runner.temp }}/hosted-${{ matrix.target }}.json"
      - name: Verify and package native raw evidence
        if: always()
        run: >-
          python tools/qualification/artifact.py hosted
          --candidate-sha "${{ github.sha }}"
          --target "${{ matrix.target }}"
          --probe "${{ runner.temp }}/hosted-${{ matrix.target }}.json"
          --output "${{ runner.temp }}/native-raw-bundle"
      - name: Record bounded observation and all full lanes
        if: always()
        run: >-
          python tools/qualification/qualify.py record
          --candidate-sha "${{ github.sha }}"
          --hosted-probe "${{ runner.temp }}/native-raw-bundle/json/hosted-${{ matrix.target }}.json"
          --raw-bundle "${{ runner.temp }}/native-raw-bundle"
          --output "${{ runner.temp }}/native-raw-bundle/json/matrix-${{ matrix.target }}.json"
      - name: Execute full hosted common corpus and staged consumer
        if: always()
        run: >-
          python tools/qualification/full_hosted.py
          --candidate-sha "${{ github.sha }}"
          --target "${{ matrix.target }}"
          --output "${{ runner.temp }}/full-hosted-${{ matrix.target }}"
      - name: Run focused Windows collision diagnostics and original fixtures
        if: always() && github.event_name == 'workflow_dispatch' && inputs.windows_diagnostics == true && matrix.target == 'mingwX64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $diagnostics = Join-Path $env:RUNNER_TEMP 'windows-native-diagnostics/focused'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $console = Join-Path $diagnostics 'mingwX64Test.console.txt'
          $exitPath = Join-Path $diagnostics 'mingwX64Test.exit-code'
          try {
            $results = 'dyn4k-core/build/test-results/mingwX64Test'
            if (Test-Path $results) {
              Copy-Item -Recurse -Force $results (Join-Path $diagnostics 'prior-xml')
            }
            & .\gradlew.bat :dyn4k-core:mingwX64Test `
              --tests 'org.dyn4j.collision.narrowphase.WindowsCollisionIntermediateDiagnosticTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CapsuleSliceTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CirclePolygonTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CircleSegmentTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CircleSliceTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.PolygonCapsuleTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.PolygonPolygonTest' `
              --rerun-tasks --console=plain 2>&1 | Tee-Object -FilePath $console
            $nativeExit = $LASTEXITCODE
            Set-Content -Path $exitPath -Value $nativeExit
            if (Test-Path $results) {
              Copy-Item -Recurse -Force $results (Join-Path $diagnostics 'xml')
            } else {
              throw "Focused native XML directory is missing: $results"
            }
            $xml = @(Get-ChildItem (Join-Path $diagnostics 'xml') -Recurse -Filter 'TEST-*.xml')
            foreach ($fixture in @('CapsuleSliceTest', 'CirclePolygonTest', 'CircleSegmentTest',
                'CircleSliceTest', 'PolygonCapsuleTest', 'PolygonPolygonTest')) {
              $fixtureXml = @($xml | Where-Object { $_.Name -like "*$($fixture).xml" })
              if ($fixtureXml.Count -eq 0) {
                throw "Focused native XML is missing original fixture: $fixture"
              }
            }
            $records = @(Select-String -Path $xml.FullName -Pattern 'DYN4K_COLLISION_DIAGNOSTIC\s+v2')
            if ($records.Count -ne 72) { throw "Expected 72 native v2 records; found $($records.Count)" }
            exit $nativeExit
          } catch {
            if (-not (Test-Path $exitPath)) { Set-Content -Path $exitPath -Value 1 }
            Set-Content -Path (Join-Path $diagnostics 'native.error.txt') -Value $_.ToString()
            Write-Error $_
            exit 1
          }
      - name: Run pinned dyn4j Java collision control on Windows
        if: always() && github.event_name == 'workflow_dispatch' && inputs.windows_diagnostics == true && matrix.target == 'mingwX64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $diagnostics = Join-Path $env:RUNNER_TEMP 'windows-native-diagnostics/java-control'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $console = Join-Path $diagnostics 'control.console.txt'
          $exitPath = Join-Path $diagnostics 'control.exit-code'
          try {
            $jar = Join-Path $env:RUNNER_TEMP 'dyn4j-6.0.0-control.jar'
            Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/dyn4j/dyn4j/6.0.0/dyn4j-6.0.0.jar' -OutFile $jar
            $source = Join-Path $env:RUNNER_TEMP 'dyn4j-control-source'
            & git clone --quiet 'https://github.com/dyn4j/dyn4j.git' $source
            if ($LASTEXITCODE -ne 0) { throw "Baseline source clone failed: $LASTEXITCODE" }
            & git -C $source checkout --quiet --detach 058bf6d982a0fb89b54050f929f6ea9dae53b714
            if ($LASTEXITCODE -ne 0) { throw "Baseline source checkout failed: $LASTEXITCODE" }
            & .\tools\diagnostic\windows_collision\run-java-control.ps1 `
              -JdkHome $env:JAVA_HOME -BaselineJar $jar `
              -BaselineSource $source -OutputDirectory $diagnostics `
              2>&1 | Tee-Object -FilePath $console
            if (-not $?) { throw 'Pinned Java control runner failed.' }
            $pins = @(Select-String -Path $console -Pattern '^PINNED_DYN4J_CONTROL ')
            if ($pins.Count -ne 1) { throw "Expected one pin summary; found $($pins.Count)" }
            Set-Content -Path (Join-Path $diagnostics 'control.pins.txt') -Value $pins[0].Line
            Set-Content -Path $exitPath -Value 0
          } catch {
            Set-Content -Path $exitPath -Value 1
            Set-Content -Path (Join-Path $diagnostics 'control.error.txt') -Value $_.ToString()
            Write-Error $_
            exit 1
          }
      - name: Independently verify full native archive
        if: always()
        run: >-
          python tools/qualification/full_hosted.py --verify
          --candidate-sha "${{ github.sha }}"
          --target "${{ matrix.target }}"
          --output "${{ runner.temp }}/full-hosted-${{ matrix.target }}"
      - name: Package full native archive
        if: always()
        run: >-
          python tools/qualification/full_hosted.py --package
          --output "${{ runner.temp }}/full-hosted-${{ matrix.target }}"
          --archive "${{ runner.temp }}/full-hosted-${{ matrix.target }}.tar"
      - name: Verify transportable full native archive
        if: always()
        run: >-
          python tools/qualification/full_hosted.py --verify-tar
          --candidate-sha "${{ github.sha }}"
          --target "${{ matrix.target }}"
          --archive "${{ runner.temp }}/full-hosted-${{ matrix.target }}.tar"
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ github.sha }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-raw-bundle/
          if-no-files-found: error
      - name: Upload full native common corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-full-${{ github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/full-hosted-${{ matrix.target }}.tar
          if-no-files-found: error
      - name: Collect Windows native failure evidence
        if: always() && matrix.target == 'mingwX64'
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/windows-native-diagnostics"
          mkdir -p "$diagnostics/xml" "$diagnostics/logs"
          printf 'sha=%s\nrun_id=%s\nrun_attempt=%s\njob=%s\ntarget=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" '${{ matrix.target }}' \
            > "$diagnostics/identity.txt"
          errors="$diagnostics/logs/collection-errors.txt"
          missing=0
          xml_manifest="$RUNNER_TEMP/windows-native-xml-files"
          find dyn4k-core dyn4k consumers/qualification/portable \
            -path '*/build/test-results/*/TEST-*.xml' -type f -print0 > "$xml_manifest"
          if [[ -s "$xml_manifest" ]]; then
            while IFS= read -r -d '' relative; do
              cp --parents -- "$relative" "$diagnostics/xml"
            done < "$xml_manifest"
          else
            printf '%s\n' 'No native test XML reports found in expected project roots.' >> "$errors"
            missing=1
          fi
          if [[ -f build/staging-repository/.qualification/mingwX64/stage.log ]]; then
            cp -- build/staging-repository/.qualification/mingwX64/stage.log "$diagnostics/logs/stage.log"
          else
            printf '%s\n' 'Missing expected mingwX64 stage log.' >> "$errors"
            missing=1
          fi
          full_hosted_root="$(cygpath -u "$RUNNER_TEMP/full-hosted-mingwX64")"
          full_hosted_manifest="$RUNNER_TEMP/windows-native-full-hosted-files"
          if [[ -d "$full_hosted_root" ]]; then
            (cd "$full_hosted_root" && find . -type f \
              \( -name stdout.txt -o -name stderr.txt \) -print0) > "$full_hosted_manifest"
            if [[ -s "$full_hosted_manifest" ]]; then
              mkdir -p "$diagnostics/logs/full-hosted"
              (
                cd "$full_hosted_root"
                while IFS= read -r -d '' relative; do
                  cp --parents -- "$relative" "$diagnostics/logs/full-hosted"
                done < "$full_hosted_manifest"
              )
            else
              printf 'No full-hosted stdout/stderr logs found under %s.\n' "$full_hosted_root" >> "$errors"
              missing=1
            fi
          else
            printf 'Missing expected full-hosted directory: %s\n' "$full_hosted_root" >> "$errors"
            missing=1
          fi
          gradle_home="$(cygpath -u "${GRADLE_USER_HOME:-$HOME/.gradle}")"
          gradle_manifest="$RUNNER_TEMP/windows-native-gradle-files"
          if [[ -d "$gradle_home/daemon" ]]; then
            (cd "$gradle_home" && find daemon -type f -name '*.out.log' -print0) > "$gradle_manifest"
            if [[ -s "$gradle_manifest" ]]; then
              mkdir -p "$diagnostics/logs/gradle-user-home"
              (
                cd "$gradle_home"
                while IFS= read -r -d '' relative; do
                  cp --parents -- "$relative" "$diagnostics/logs/gradle-user-home"
                done < "$gradle_manifest"
              )
            else
              printf 'No Gradle daemon logs found under %s/daemon.\n' "$gradle_home" >> "$errors"
              missing=1
            fi
          else
            printf 'Missing expected Gradle daemon directory: %s/daemon\n' "$gradle_home" >> "$errors"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            cat "$errors" >&2
            exit 1
          fi
      - name: Upload Windows native failure evidence
        if: always() && matrix.target == 'mingwX64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-raw-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.target }}
          path: ${{ runner.temp }}/windows-native-diagnostics/
          if-no-files-found: warn

  safari-browser:
    if: github.event_name != 'workflow_dispatch' || inputs.windows_diagnostics != true
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SAFARI_BIN: ${{ github.workspace }}/tools/qualification/safari-launch.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Select pinned Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute staged Safari browser probe
        run: >-
          python tools/qualification/hosted.py run
          --candidate-sha "${{ github.sha }}"
          --target jsSafari
          --output "${{ runner.temp }}/hosted-jsSafari.json"
      - name: Verify and package Safari raw evidence
        if: always()
        run: >-
          python tools/qualification/artifact.py hosted
          --candidate-sha "${{ github.sha }}"
          --target jsSafari
          --probe "${{ runner.temp }}/hosted-jsSafari.json"
          --output "${{ runner.temp }}/safari-raw-bundle"
      - name: Record bounded observation and all full lanes
        if: always()
        run: >-
          python tools/qualification/qualify.py record
          --candidate-sha "${{ github.sha }}"
          --hosted-probe "${{ runner.temp }}/safari-raw-bundle/json/hosted-jsSafari.json"
          --raw-bundle "${{ runner.temp }}/safari-raw-bundle"
          --output "${{ runner.temp }}/safari-raw-bundle/json/matrix-jsSafari.json"
      - name: Execute full Safari common corpus and staged consumer
        if: always()
        run: >-
          python tools/qualification/full_hosted.py
          --candidate-sha "${{ github.sha }}"
          --target jsSafari
          --output "${{ runner.temp }}/full-hosted-jsSafari"
      - name: Independently verify full Safari archive
        if: always()
        run: >-
          python tools/qualification/full_hosted.py --verify
          --candidate-sha "${{ github.sha }}"
          --target jsSafari
          --output "${{ runner.temp }}/full-hosted-jsSafari"
      - name: Package full Safari archive
        if: always()
        run: >-
          python tools/qualification/full_hosted.py --package
          --output "${{ runner.temp }}/full-hosted-jsSafari"
          --archive "${{ runner.temp }}/full-hosted-jsSafari.tar"
      - name: Verify transportable full Safari archive
        if: always()
        run: >-
          python tools/qualification/full_hosted.py --verify-tar
          --candidate-sha "${{ github.sha }}"
          --target jsSafari
          --archive "${{ runner.temp }}/full-hosted-jsSafari.tar"
      - name: Upload Safari evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ github.sha }}-jsSafari
          path: |
            ${{ runner.temp }}/safari-raw-bundle/
          if-no-files-found: error
      - name: Upload full Safari common corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-full-${{ github.sha }}-jsSafari
          path: ${{ runner.temp }}/full-hosted-jsSafari.tar
          if-no-files-found: error
