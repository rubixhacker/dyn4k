name: Windows collision focus

on:
  workflow_dispatch:
    inputs:
      route:
        description: Focused evidence predicate
        required: true
        type: choice
        default: historical-pc53
        options:
          - historical-pc53
          - corrected-production

permissions:
  contents: read

jobs:
  windows-collision-focus:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify candidate revision
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne '${{ github.sha }}') {
            throw "Checkout revision mismatch: $actual"
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run focused native and pinned Java controls
        shell: pwsh
        timeout-minutes: 75
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $route = '${{ inputs.route }}'
          if ($route -notin @('historical-pc53', 'corrected-production')) { throw "Unknown collision route: $route" }
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-collision-focus'
          $native = Join-Path $evidence 'native'
          $precision = Join-Path $native 'pc53'
          $java = Join-Path $evidence 'java'
          New-Item -ItemType Directory -Force -Path $native, $precision, $java | Out-Null
          Set-Content -Path (Join-Path $evidence 'route.txt') -Value $route
          $diagnosticDeadlineEpoch = [DateTimeOffset]::UtcNow.AddMinutes(60).ToUnixTimeSeconds()
          Set-Content -Path (Join-Path $evidence 'diagnostic-deadline-epoch.txt') -Value $diagnosticDeadlineEpoch
          $gradleExit = $null
          $precisionExit = 'NOT_RUN'
          $javaExit = -1
          $scalarExit = 1
          $collectionStatus = 0
          $validationStatus = 0
          $nativeStarted = $false
          $nativeLog = Join-Path $native 'gradle-console.log'
          $gradleExitFile = Join-Path $native 'gradle-exit-code.txt'
          $gradleCommandFile = Join-Path $native 'gradle-command.txt'
          $javaLog = Join-Path $java 'java-console.log'
          $javaExitFile = Join-Path $java 'java-exit-code.txt'
          $scalar = Join-Path $evidence 'scalar'
          $scalarLog = Join-Path $scalar 'scalar-control-console.log'
          $scalarStdout = Join-Path $scalar 'scalar-control-stdout.log'
          $scalarStderr = Join-Path $scalar 'scalar-control-stderr.log'
          $scalarExitFile = Join-Path $scalar 'scalar-exit-code.txt'
          $collectionErrors = [System.Collections.Generic.List[string]]::new()
          $results = Join-Path $PWD 'dyn4k-core/build/test-results/mingwX64Test'
          $xmlFiles = @()

          try {
            if (Test-Path $results) { Remove-Item -LiteralPath $results -Recurse -Force }
            $gradleCommand = @(
              '.\gradlew.bat'
              ':dyn4k-core:mingwX64Test'
              '--tests org.dyn4j.collision.narrowphase.WindowsCollisionIntermediateDiagnosticTest'
              '--tests org.dyn4j.coverage.collision.shapes.a.CapsuleSliceTest'
              '--tests org.dyn4j.coverage.collision.shapes.a.CirclePolygonTest'
              '--tests org.dyn4j.coverage.collision.shapes.a.CircleSegmentTest'
              '--tests org.dyn4j.coverage.collision.shapes.a.CircleSliceTest'
              '--tests org.dyn4j.coverage.collision.shapes.a.PolygonCapsuleTest'
              '--tests org.dyn4j.coverage.collision.shapes.a.PolygonPolygonTest'
              '--no-daemon --rerun-tasks --console=plain --info'
            )
            $gradleCommand | Set-Content -Path $gradleCommandFile
            $nativeStarted = $true
            if ($route -eq 'corrected-production') {
              $gradleStdout = Join-Path $native 'gradle-stdout.log'
              $gradleStderr = Join-Path $native 'gradle-stderr.log'
              & python .\tools\diagnostic\windows_collision\collect-test-pe.py run-bounded `
                --timeout-seconds 2400 --deadline-epoch $diagnosticDeadlineEpoch `
                --stdout $gradleStdout --stderr $gradleStderr `
                --receipt (Join-Path $native 'gradle-receipt.json') `
                -- cmd.exe /d /s /c ($gradleCommand -join ' ')
              $gradleExit = [string]$LASTEXITCODE
              Get-Content -LiteralPath $gradleStdout, $gradleStderr -ErrorAction SilentlyContinue |
                Set-Content -Path $nativeLog
              Get-Content -LiteralPath $nativeLog
            } else {
              & .\gradlew.bat :dyn4k-core:mingwX64Test `
              --tests 'org.dyn4j.collision.narrowphase.WindowsCollisionIntermediateDiagnosticTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CapsuleSliceTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CirclePolygonTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CircleSegmentTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CircleSliceTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.PolygonCapsuleTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.PolygonPolygonTest' `
              --no-daemon --rerun-tasks --console=plain --info 2>&1 | Tee-Object -FilePath $nativeLog
              $gradleExit = [string]$LASTEXITCODE
            }
          } catch {
            try { $_ | Out-String | Add-Content -Path $nativeLog -ErrorAction Stop }
            catch {
              $collectionErrors.Add("Gradle console collection failed: $($_.ToString())")
              $collectionStatus = 1
            }
            if ($null -eq $gradleExit) {
              if ($nativeStarted -and $null -ne $LASTEXITCODE) {
                $gradleExit = [string]$LASTEXITCODE
              } else {
                $gradleExit = 'NOT_RUN'
              }
            }
          }
          if ($null -eq $gradleExit) { $gradleExit = 'NOT_RUN' }
          try {
            Set-Content -Path $gradleExitFile -Value $gradleExit
          } catch {
            $collectionErrors.Add("Gradle exit code record failed: $($_.ToString())")
            $collectionStatus = 1
          }

          try {
            if (-not $nativeStarted) { throw 'Native test command did not start after result cleanup.' }
            $xmlFiles = @(Get-ChildItem $results -Filter 'TEST-*.xml' -File -ErrorAction Stop)
          } catch {
            $collectionErrors.Add("Native XML listing failed: $($_.ToString())")
            $collectionStatus = 1
          }
          if ($null -ne $xmlFiles) {
            foreach ($file in $xmlFiles) {
              try {
                Copy-Item -LiteralPath $file.FullName -Destination $native -ErrorAction Stop
              } catch {
                $collectionErrors.Add("Native XML copy failed for $($file.Name): $($_.ToString())")
                $collectionStatus = 1
              }
            }
          }
          if ($xmlFiles.Count -ne 7) {
            $collectionErrors.Add("Expected seven original same-run XML reports; found $($xmlFiles.Count)")
            $collectionStatus = 1
          }

          $testPeDirectory = Join-Path $native 'test-pe'
          $testPeStdout = Join-Path $native 'test-pe-collector-stdout.log'
          $testPeStderr = Join-Path $native 'test-pe-collector-stderr.log'
          try {
            & python .\tools\diagnostic\windows_collision\collect-test-pe.py collect `
              --test-directory (Join-Path $PWD 'dyn4k-core/build/bin/mingwX64/debugTest') `
              --output-directory $testPeDirectory --gradle-log $nativeLog `
              --gradle-command $gradleCommandFile --build-file (Join-Path $PWD 'dyn4k-core/build.gradle.kts') `
              --deadline-epoch $diagnosticDeadlineEpoch `
              1> $testPeStdout 2> $testPeStderr
            $testPeExit = $LASTEXITCODE
            if ($null -eq $testPeExit -or $testPeExit -ne 0) {
              $collectionErrors.Add("debugTest PE collection failed with exit $testPeExit")
              $collectionStatus = 1
            }
          } catch {
            $testPeExit = 1
            $collectionErrors.Add("debugTest PE collection could not run: $($_.ToString())")
            $collectionStatus = 1
          }
          Set-Content -Path (Join-Path $native 'test-pe-collector-exit-code.txt') -Value $testPeExit

          if ($route -eq 'historical-pc53') {
          $precisionCommand = @(
            '.\gradlew.bat', ':dyn4k-core:mingwX64Test',
            '--tests', 'org.dyn4j.collision.narrowphase.WindowsCollisionPrecisionControlTest',
            '-PwindowsCollisionPrecisionDiagnostic=true',
            '--no-daemon', '--rerun-tasks', '--console=plain', '--info'
          )
          $precisionCommand | Set-Content -Path (Join-Path $precision 'gradle-command.txt')
          $precisionStdout = Join-Path $precision 'gradle-stdout.log'
          $precisionStderr = Join-Path $precision 'gradle-stderr.log'
          $precisionReceipt = Join-Path $precision 'gradle-receipt.json'
          try {
            if (Test-Path $results) { Remove-Item -LiteralPath $results -Recurse -Force }
            & python .\tools\diagnostic\windows_collision\collect-test-pe.py run-bounded `
              --timeout-seconds 1200 --deadline-epoch $diagnosticDeadlineEpoch `
              --stdout $precisionStdout --stderr $precisionStderr --receipt $precisionReceipt `
              -- cmd.exe /d /s /c ($precisionCommand -join ' ')
            $precisionExit = [string]$LASTEXITCODE
          } catch {
            $precisionExit = 'START_FAILED'
            $_ | Out-String | Set-Content -Path (Join-Path $precision 'gradle-launch-error.log')
            $collectionErrors.Add("Controlled Gradle invocation failed to start: $($_.ToString())")
            $collectionStatus = 1
          }
          Set-Content -Path (Join-Path $precision 'gradle-exit-code.txt') -Value $precisionExit
          try {
            $controlledXml = @(Get-ChildItem $results -Filter 'TEST-*.xml' -File -ErrorAction Stop)
            $controlledName = 'TEST-mingwX64Test.org.dyn4j.collision.narrowphase.WindowsCollisionPrecisionControlTest.xml'
            if ($controlledXml.Count -ne 1 -or $controlledXml[0].Name -ne $controlledName) {
              throw "Expected one controlled XML report; found $($controlledXml.Count)"
            }
            Copy-Item -LiteralPath $controlledXml[0].FullName -Destination $precision -ErrorAction Stop
          } catch {
            $collectionErrors.Add("Controlled XML collection failed: $($_.ToString())")
            $collectionStatus = 1
          }
          try {
            $controlledPe = Join-Path $PWD 'dyn4k-core/build/bin/mingwX64/debugTest/test.exe'
            Copy-Item -LiteralPath $controlledPe -Destination (Join-Path $precision 'test.exe') -ErrorAction Stop
            $controlledPeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $precision 'test.exe')).Hash.ToLowerInvariant()
            Set-Content -Path (Join-Path $precision 'test-executable-sha256.txt') -Value "$controlledPeHash  test.exe"
          } catch {
            $collectionErrors.Add("Controlled test PE collection failed: $($_.ToString())")
            $collectionStatus = 1
          }
          }

          try {
            $jar = Join-Path $env:RUNNER_TEMP 'dyn4j-6.0.0.jar'
            Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/dyn4j/dyn4j/6.0.0/dyn4j-6.0.0.jar' -OutFile $jar
            $jarSha256 = (Get-FileHash -Algorithm SHA256 $jar).Hash.ToLowerInvariant()
            if ($jarSha256 -ne '204ca8dd55626ad3727b82dacb37df1800c5eff0d6bb6e782b6e5af5162b2b3e') {
              throw "Baseline JAR SHA-256 mismatch: $jarSha256"
            }
            $source = Join-Path $env:RUNNER_TEMP 'dyn4j-6.0.0-source'
            & git init $source
            if ($LASTEXITCODE -ne 0) { throw "Baseline source init failed: $LASTEXITCODE" }
            & git -C $source remote add origin https://github.com/dyn4j/dyn4j.git
            if ($LASTEXITCODE -ne 0) { throw "Baseline source remote failed: $LASTEXITCODE" }
            & git -C $source fetch --depth=1 origin 058bf6d982a0fb89b54050f929f6ea9dae53b714
            if ($LASTEXITCODE -ne 0) { throw "Baseline source fetch failed: $LASTEXITCODE" }
            & git -C $source checkout --quiet --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw "Baseline source checkout failed: $LASTEXITCODE" }
            $sourceRevision = (& git -C $source rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $sourceRevision -ne '058bf6d982a0fb89b54050f929f6ea9dae53b714') {
              throw "Baseline source revision mismatch: $sourceRevision"
            }
            Set-Content -Path (Join-Path $evidence 'baseline-source-revision.txt') -Value $sourceRevision
            if ($route -eq 'corrected-production') {
              $javaStdout = Join-Path $java 'java-stdout.log'
              $javaStderr = Join-Path $java 'java-stderr.log'
              @('.\tools\diagnostic\windows_collision\run-java-control.ps1',
                "-JdkHome $env:JAVA_HOME", "-BaselineJar $jar", "-BaselineSource $source", "-OutputDirectory $java") |
                Set-Content -Path (Join-Path $java 'java-command.txt')
              & .\tools\diagnostic\windows_collision\run-java-control.ps1 `
                -JdkHome $env:JAVA_HOME -BaselineJar $jar `
                -BaselineSource $source -OutputDirectory $java `
                1> $javaStdout 2> $javaStderr
              $javaExit = $LASTEXITCODE
              Get-Content -LiteralPath $javaStdout, $javaStderr `
                -ErrorAction SilentlyContinue | Set-Content -Path $javaLog
              Get-Content -LiteralPath $javaLog
            } else {
              & .\tools\diagnostic\windows_collision\run-java-control.ps1 `
                -JdkHome $env:JAVA_HOME -BaselineJar $jar `
                -BaselineSource $source -OutputDirectory $java `
                2>&1 | Tee-Object -FilePath $javaLog
              $javaExit = $LASTEXITCODE
            }
          } catch {
            $javaError = $_.ToString()
            try { $_ | Out-String | Add-Content -Path $javaLog -ErrorAction Stop }
            catch {
              $collectionErrors.Add("Java console collection failed: $($_.ToString())")
              $collectionStatus = 1
            }
            $collectionErrors.Add("Pinned Java control failed: $javaError")
            $javaExit = 1
          } finally {
            try {
              Set-Content -Path $javaExitFile -Value $javaExit
            } catch {
              $collectionErrors.Add("Java exit code record failed: $($_.ToString())")
              $collectionStatus = 1
            }
          }

          try {
            New-Item -ItemType Directory -Force -Path $scalar | Out-Null
            $konanRoot = Join-Path $env:USERPROFILE '.konan'
            $konanDistributions = @(Get-ChildItem -LiteralPath $konanRoot -Directory -Filter 'kotlin-native-prebuilt-windows-x86_64-2.4.20' -ErrorAction Stop)
            if ($konanDistributions.Count -ne 1) {
              throw "Expected one installed Kotlin/Native 2.4.20 Windows distribution under $konanRoot; found $($konanDistributions.Count)"
            }
            $konancHome = $konanDistributions[0].FullName
            $konanc = Join-Path $konancHome 'bin/kotlinc-native.bat'
            if (-not (Test-Path -LiteralPath $konanc -PathType Leaf)) {
              throw "Kotlin/Native compiler is missing: $konanc"
            }
            $konancVersion = (& $konanc -version 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $konancVersion -notmatch '(?<![-A-Za-z0-9_~+/])2\.4\.20(?![-A-Za-z0-9_~+/]|\.[A-Za-z0-9])') {
              throw "Kotlin/Native version check failed: $konancVersion"
            }
            Set-Content -Path (Join-Path $scalar 'kotlin-native-version.txt') -Value $konancVersion
            $pwsh = Get-Command pwsh.exe -ErrorAction Stop
            & $pwsh.Source -NoProfile -File .\tools\diagnostic\windows_collision\run-scalar-control.ps1 `
              -KonancHome $konancHome -JdkHome $env:JAVA_HOME -BaselineJar $jar `
              -BaselineSource $source -OutputDirectory $scalar `
              1> $scalarStdout 2> $scalarStderr
            $scalarExit = $LASTEXITCODE
            if ($null -eq $scalarExit) { $scalarExit = 1 }
            @(
              "exit_code=$scalarExit"
              '--- stdout ---'
              Get-Content -LiteralPath $scalarStdout -ErrorAction SilentlyContinue
              '--- stderr ---'
              Get-Content -LiteralPath $scalarStderr -ErrorAction SilentlyContinue
            ) | Set-Content -Path $scalarLog
            Get-Content -LiteralPath $scalarLog
          } catch {
            try { $_ | Out-String | Add-Content -Path $scalarLog -ErrorAction Stop }
            catch {
              $collectionErrors.Add("Scalar control console collection failed: $($_.ToString())")
              $collectionStatus = 1
            }
            $scalarExit = 1
          } finally {
            try {
              Set-Content -Path $scalarExitFile -Value $scalarExit
            } catch {
              $collectionErrors.Add("Scalar control exit code record failed: $($_.ToString())")
              $collectionStatus = 1
            }
          }

          $scalarExecutable = Join-Path $scalar 'windows-collision-scalar.exe'
          if (Test-Path -LiteralPath $scalarExecutable -PathType Leaf) {
            try {
              $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
              $objdump = Get-Command llvm-objdump.exe, objdump.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -ne $dumpbin) {
                & $dumpbin.Source /imports $scalarExecutable 2>&1 |
                  Set-Content -Path (Join-Path $scalar 'native-imports.txt')
                Set-Content -Path (Join-Path $scalar 'native-imports-exit-code.txt') -Value $LASTEXITCODE
              } else {
                Set-Content -Path (Join-Path $scalar 'native-imports-status.txt') -Value 'UNAVAILABLE: dumpbin.exe not found'
              }
              if ($null -ne $objdump) {
                & $objdump.Source -d $scalarExecutable 2>&1 |
                  Set-Content -Path (Join-Path $scalar 'native-disassembly.txt')
                Set-Content -Path (Join-Path $scalar 'native-disassembly-exit-code.txt') -Value $LASTEXITCODE
              } else {
                Set-Content -Path (Join-Path $scalar 'native-disassembly-status.txt') -Value 'UNAVAILABLE: llvm-objdump.exe and objdump.exe not found'
              }
            } catch {
              $collectionErrors.Add("Optional native import or disassembly collection failed: $($_.ToString())")
              $collectionStatus = 1
            }
          } else {
            Set-Content -Path (Join-Path $scalar 'native-executable-status.txt') -Value 'UNAVAILABLE: scalar compiler did not produce an executable'
          }

          $modes = Join-Path $evidence 'modes'
          $modeStdout = Join-Path $modes 'mode-control-stdout.log'
          $modeStderr = Join-Path $modes 'mode-control-stderr.log'
          $modeValidation = Join-Path $modes 'mode-validation.log'
          New-Item -ItemType Directory -Force -Path $modes | Out-Null
          $modeExit = 1
          try {
            $modePwsh = Get-Command pwsh.exe -ErrorAction Stop
            & $modePwsh.Source -NoProfile -File .\tools\diagnostic\windows_collision\run-mode-controls.ps1 `
              -OutputDirectory $modes -DeadlineEpoch $diagnosticDeadlineEpoch 1> $modeStdout 2> $modeStderr
            $modeExit = $LASTEXITCODE
            if ($null -eq $modeExit) { $modeExit = 1 }
          } catch {
            $collectionErrors.Add("Native mode control could not run: $($_.ToString())")
            $_ | Out-String | Set-Content -Path $modeStderr
          }
          Set-Content -Path (Join-Path $modes 'mode-control-exit-code.txt') -Value $modeExit
          try {
            & python .\tools\diagnostic\windows_collision\validate-mode-control.py validate `
              --directory $modes 2>&1 | Tee-Object -FilePath $modeValidation
            $modeValidationExit = $LASTEXITCODE
            if ($null -eq $modeValidationExit) { $modeValidationExit = 1 }
          } catch {
            $modeValidationExit = 1
            $_ | Out-String | Set-Content -Path $modeValidation
          }
          Set-Content -Path (Join-Path $modes 'mode-validation-exit-code.txt') -Value $modeValidationExit
          if ($modeExit -ne 0 -or $modeValidationExit -ne 0) {
            $collectionErrors.Add("Native mode controls failed: runner=$modeExit validator=$modeValidationExit")
            $collectionStatus = 1
          }

          $correctedProbe = Join-Path $evidence 'corrected-probe'
          $correctedProbeExit = 'NOT_RUN'
          if ($route -eq 'corrected-production') {
            New-Item -ItemType Directory -Force -Path $correctedProbe | Out-Null
            $engineSources = @(
              'dyn4k-core/src/commonMain/kotlin/org/dyn4j/geometry/Vector2.kt'
              'dyn4k-core/src/commonMain/kotlin/org/dyn4j/geometry/NearestSqrt.kt'
              'dyn4k-core/src/nativeMain/kotlin/org/dyn4j/geometry/NearestSqrtPlatform.kt'
              'dyn4k-core/src/jvmMain/kotlin/org/dyn4j/geometry/NearestSqrtPlatform.kt'
              'dyn4k-core/src/androidMain/kotlin/org/dyn4j/geometry/NearestSqrtPlatform.kt'
              'dyn4k-core/src/jsMain/kotlin/org/dyn4j/geometry/NearestSqrtPlatform.kt'
              'dyn4k-core/src/wasmJsMain/kotlin/org/dyn4j/geometry/NearestSqrtPlatform.kt'
              'dyn4k-core/src/wasmWasiMain/kotlin/org/dyn4j/geometry/NearestSqrtPlatform.kt'
              'tools/diagnostic/windows_collision/SqrtOperationNativeProbe.kt'
            )
            try {
              $hashLines = foreach ($relativeSource in $engineSources) {
                $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $PWD $relativeSource) -ErrorAction Stop).Hash.ToLowerInvariant()
                "$hash  $relativeSource"
              }
              $hashLines | Set-Content -Path (Join-Path $correctedProbe 'source-sha256.txt')
              $commonSource = Join-Path $PWD $engineSources[1]
              $nativeSource = Join-Path $PWD $engineSources[2]
              $probeSource = Join-Path $PWD $engineSources[8]
              if (-not (Test-Path -LiteralPath $konanc -PathType Leaf)) { throw 'Pinned Kotlin/Native compiler is unavailable' }
              $correctedFailures = [System.Collections.Generic.List[string]]::new()
              foreach ($probeMode in @(@{ Name = 'debug-g'; Flag = '-g' }, @{ Name = 'optimized-opt'; Flag = '-opt' })) {
                $probeModeDirectory = Join-Path $correctedProbe $probeMode.Name
                New-Item -ItemType Directory -Force -Path $probeModeDirectory | Out-Null
                $outputBase = Join-Path $probeModeDirectory 'sqrt-operation-probe'
                $probePe = "$outputBase.exe"
                $arguments = @('-Xmulti-platform', "-Xcommon-sources=$commonSource", $commonSource, $nativeSource, $probeSource,
                  '-target', 'mingw_x64', $probeMode.Flag, '-o', $outputBase)
                [pscustomobject]@{ mode = $probeMode.Name; executable = $konanc; arguments = $arguments } |
                  ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $probeModeDirectory 'compiler-command.json')
                $compileExit = 1
                try {
                  & python .\tools\diagnostic\windows_collision\collect-test-pe.py run-bounded `
                    --timeout-seconds 240 --deadline-epoch $diagnosticDeadlineEpoch `
                    --stdout (Join-Path $probeModeDirectory 'compiler-stdout.log') `
                    --stderr (Join-Path $probeModeDirectory 'compiler-stderr.log') `
                    --receipt (Join-Path $probeModeDirectory 'compiler-receipt.json') `
                    -- $konanc @arguments
                  $compileExit = $LASTEXITCODE
                } catch {
                  $_ | Out-String | Set-Content -Path (Join-Path $probeModeDirectory 'compiler-error.log')
                }
                Set-Content -Path (Join-Path $probeModeDirectory 'compiler-exit-code.txt') -Value $compileExit
                if (Test-Path -LiteralPath $probePe -PathType Leaf) {
                  $peHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $probePe).Hash.ToLowerInvariant()
                  Set-Content -Path (Join-Path $probeModeDirectory 'executable-sha256.txt') -Value "$peHash  sqrt-operation-probe.exe"
                } else {
                  Set-Content -Path (Join-Path $probeModeDirectory 'executable-status.txt') -Value 'UNAVAILABLE: compiler did not produce a PE'
                }
                if ($compileExit -ne 0 -or -not (Test-Path -LiteralPath $probePe -PathType Leaf)) {
                  $correctedFailures.Add("$($probeMode.Name): compiler exit $compileExit or PE unavailable")
                  Set-Content -Path (Join-Path $probeModeDirectory 'run-exit-code.txt') -Value 'NOT_RUN'
                  continue
                }
                $probeRunExit = 1
                try {
                  & python .\tools\diagnostic\windows_collision\collect-test-pe.py run-bounded `
                    --timeout-seconds 30 --deadline-epoch $diagnosticDeadlineEpoch `
                    --stdout (Join-Path $probeModeDirectory 'probe-stdout.tsv') `
                    --stderr (Join-Path $probeModeDirectory 'probe-stderr.log') `
                    --receipt (Join-Path $probeModeDirectory 'run-receipt.json') `
                    -- $probePe
                  $probeRunExit = $LASTEXITCODE
                } catch {
                  $_ | Out-String | Set-Content -Path (Join-Path $probeModeDirectory 'run-error.log')
                }
                Set-Content -Path (Join-Path $probeModeDirectory 'run-exit-code.txt') -Value $probeRunExit
                if ($probeRunExit -ne 0) { $correctedFailures.Add("$($probeMode.Name): probe exit $probeRunExit") }
              }
              $correctedProbeExit = if ($correctedFailures.Count -eq 0) { '0' } else { '1' }
              if ($correctedFailures.Count -gt 0) { $correctedFailures | Set-Content -Path (Join-Path $correctedProbe 'probe-errors.txt') }
            } catch {
              $correctedProbeExit = '1'
              $_ | Out-String | Set-Content -Path (Join-Path $correctedProbe 'probe-launch-error.log')
            }
            Set-Content -Path (Join-Path $correctedProbe 'probe-exit-code.txt') -Value $correctedProbeExit
          }

          try {
            $javaTsv = Join-Path $java 'dyn4j-6.0.0-windows-control.tsv'
            $nativeTsv = Join-Path $native 'mingwX64-collision-diagnostics.tsv'
            $validationLog = Join-Path $evidence 'trace-validation.log'
            & python tools/compatibility/windows_collision_focus.py `
              validate --native-directory $native --java-tsv $javaTsv --native-tsv $nativeTsv `
              2>&1 | Tee-Object -FilePath $validationLog
            $validationExit = $LASTEXITCODE
            if ($validationExit -ne 0) {
              $collectionErrors.Add("Shared XML and TSV validation failed with exit $validationExit")
              $validationStatus = 1
            }
          } catch {
            $collectionErrors.Add("Shared XML and TSV validation could not run: $($_.ToString())")
            $validationStatus = 1
          }
          if ($route -eq 'historical-pc53') {
          try {
            $precisionValidation = Join-Path $precision 'precision-validation.log'
            $candidateSource = (& git rev-parse HEAD).Trim()
            & python tools/diagnostic/windows_collision/validate-precision-control.py validate `
              --native-directory $native --controlled-directory $precision `
              --java-trace $javaTsv --java-scalars (Join-Path $scalar 'java-scalar.tsv') `
              --controlled-trace (Join-Path $precision 'mingwX64-collision-diagnostics-pc53.tsv') `
              --result (Join-Path $precision 'precision-result.json') --source-sha $candidateSource `
              2>&1 | Tee-Object -FilePath $precisionValidation
            $precisionValidationExit = $LASTEXITCODE
            if ($null -eq $precisionValidationExit -or $precisionValidationExit -ne 0) {
              $collectionErrors.Add("Precision control validation failed with exit $precisionValidationExit")
              $validationStatus = 1
            }
          } catch {
            $precisionValidationExit = 1
            $collectionErrors.Add("Precision control validation could not run: $($_.ToString())")
            $validationStatus = 1
          }
          Set-Content -Path (Join-Path $precision 'precision-validation-exit-code.txt') -Value $precisionValidationExit
          } else {
            try {
              $candidateSource = (& git rev-parse HEAD).Trim()
              $correctedValidation = Join-Path $correctedProbe 'corrected-validation.log'
              & python tools/diagnostic/windows_collision/validate-precision-control.py validate-corrected `
                --native-directory $native --java-trace $javaTsv `
                --native-scalars (Join-Path $scalar 'native-scalar.tsv') `
                --java-scalars (Join-Path $scalar 'java-scalar.tsv') `
                --probe-directory $correctedProbe --source-sha $candidateSource `
                --result (Join-Path $correctedProbe 'corrected-result.json') `
                2>&1 | Tee-Object -FilePath $correctedValidation
              $correctedValidationExit = $LASTEXITCODE
              if ($null -eq $correctedValidationExit -or $correctedValidationExit -ne 0) {
                $collectionErrors.Add("Corrected production validation failed with exit $correctedValidationExit")
                $validationStatus = 1
              }
            } catch {
              $correctedValidationExit = 1
              $collectionErrors.Add("Corrected production validation could not run: $($_.ToString())")
              $validationStatus = 1
            }
            Set-Content -Path (Join-Path $correctedProbe 'corrected-validation-exit-code.txt') -Value $correctedValidationExit
          }
          try {
            Set-Content -Path (Join-Path $evidence 'validation-status.txt') -Value $validationStatus
          } catch {
            $collectionErrors.Add("Validation status record failed: $($_.ToString())")
            $collectionStatus = 1
          }

          try {
            @(
              "candidate=$(git rev-parse HEAD)"
              "runner_os=$env:RUNNER_OS"
              "runner_arch=$env:RUNNER_ARCH"
              "image_os=$env:ImageOS"
              "image_version=$env:ImageVersion"
              "java_home=$env:JAVA_HOME"
              "java_version=$(& java -version 2>&1 | Select-Object -First 1)"
              "gradle_version=$(& .\gradlew.bat --version --console=plain | Select-String '^Gradle ' | Select-Object -First 1)"
              "powershell=$($PSVersionTable.PSVersion)"
            ) | Set-Content -Path (Join-Path $evidence 'runner-runtime-identity.txt')
          } catch {
            $collectionErrors.Add("Runner identity collection failed: $($_.ToString())")
            $collectionStatus = 1
          }

          $controlSources = @(
            'tools/diagnostic/windows_collision/WindowsCollisionScalarControl.kt'
            'tools/diagnostic/windows_collision/WindowsCollisionScalarJavaControl.java'
            'tools/diagnostic/windows_collision/run-scalar-control.ps1'
            'tools/diagnostic/windows_collision/validate-scalar-control.py'
            '.github/workflows/windows-collision-focus.yml'
            'tools/diagnostic/windows_collision/collect-test-pe.py'
            'tools/diagnostic/windows_collision/run-mode-controls.ps1'
            'tools/diagnostic/windows_collision/validate-mode-control.py'
            'tools/diagnostic/windows_collision/validate-precision-control.py'
            'tools/diagnostic/windows_collision/SqrtOperationNativeProbe.kt'
            'tools/compatibility/windows_collision_focus.py'
            'dyn4k-core/src/commonTest/kotlin/org/dyn4j/collision/narrowphase/WindowsCollisionIntermediateDiagnosticTest.kt'
            'dyn4k-core/diagnostic/windows-collision/WindowsCollisionPrecisionControlTest.kt'
            'dyn4k-core/build.gradle.kts'
            'dyn4k-core/src/commonTest/kotlin/org/dyn4j/coverage/collision/shapes/a/CapsuleSliceTest.kt'
            'dyn4k-core/src/commonTest/kotlin/org/dyn4j/coverage/collision/shapes/a/CirclePolygonTest.kt'
            'dyn4k-core/src/commonTest/kotlin/org/dyn4j/coverage/collision/shapes/a/CircleSegmentTest.kt'
            'dyn4k-core/src/commonTest/kotlin/org/dyn4j/coverage/collision/shapes/a/CircleSliceTest.kt'
            'dyn4k-core/src/commonTest/kotlin/org/dyn4j/coverage/collision/shapes/a/PolygonCapsuleTest.kt'
            'dyn4k-core/src/commonTest/kotlin/org/dyn4j/coverage/collision/shapes/a/PolygonPolygonTest.kt'
          )
          $controlSourceHashes = [System.Collections.Generic.List[string]]::new()
          foreach ($relativeSource in $controlSources) {
            try {
              $sourcePath = Join-Path $PWD $relativeSource
              if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
                throw "Control source is missing: $relativeSource"
              }
              $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath -ErrorAction Stop).Hash.ToLowerInvariant()
              $controlSourceHashes.Add("$sourceHash  $relativeSource")
            } catch {
              $collectionErrors.Add("Control source hash failed for $relativeSource`: $($_.ToString())")
              $collectionStatus = 1
            }
          }
          try {
            $controlSourceHashes | Set-Content -Path (Join-Path $evidence 'control-source-sha256.txt') -ErrorAction Stop
          } catch {
            $collectionErrors.Add("Control source hash record failed: $($_.ToString())")
            $collectionStatus = 1
          }

          try {
            Set-Content -Path (Join-Path $evidence 'collection-status.txt') -Value $collectionStatus
          } catch {
            $collectionErrors.Add("Collection status record failed: $($_.ToString())")
            $collectionStatus = 1
          }
          if ($collectionErrors.Count -gt 0) {
            try {
              $collectionErrors | Set-Content -Path (Join-Path $evidence 'collection-errors.txt')
            } catch {
              $collectionStatus = 1
            }
          }
          $inventory = Join-Path $evidence 'sha256-inventory.txt'
          try {
            Get-ChildItem $evidence -Recurse -File -ErrorAction Stop | Where-Object FullName -ne $inventory |
              Sort-Object FullName | ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($evidence, $_.FullName)
                $hash = (Get-FileHash -Algorithm SHA256 $_.FullName -ErrorAction Stop).Hash.ToLowerInvariant()
                "$hash  $relative"
              } | Set-Content -Path $inventory
          } catch {
            $collectionErrors.Add("SHA-256 inventory failed: $($_.ToString())")
            $collectionStatus = 1
            try {
              $collectionErrors | Set-Content -Path (Join-Path $evidence 'collection-errors.txt') -ErrorAction Stop
              Set-Content -Path (Join-Path $evidence 'collection-status.txt') -Value $collectionStatus -ErrorAction Stop
              Set-Content -Path (Join-Path $evidence 'validation-status.txt') -Value $validationStatus -ErrorAction Stop
              Get-ChildItem $evidence -Recurse -File -ErrorAction Stop | Where-Object FullName -ne $inventory |
                Sort-Object FullName | ForEach-Object {
                  $relative = [IO.Path]::GetRelativePath($evidence, $_.FullName)
                  $hash = (Get-FileHash -Algorithm SHA256 $_.FullName -ErrorAction Stop).Hash.ToLowerInvariant()
                  "$hash  $relative"
                } | Set-Content -Path $inventory -ErrorAction Stop
            } catch {
              $collectionErrors.Add("SHA-256 inventory retry failed: $($_.ToString())")
              $collectionStatus = 1
              try {
                $collectionErrors | Set-Content -Path (Join-Path $evidence 'collection-errors.txt') -ErrorAction Stop
                Set-Content -Path (Join-Path $evidence 'collection-status.txt') -Value $collectionStatus -ErrorAction Stop
              } catch { }
            }
          }

          $statusLog = Join-Path $evidence 'final-status.log'
          $statusExit = 1
          try {
            & python tools/compatibility/windows_collision_focus.py status `
              --gradle-exit-code $gradleExit --java-exit-code $javaExit `
              --collection-status $collectionStatus --validation-status $validationStatus `
              2>&1 | Tee-Object -FilePath $statusLog
            $statusExit = $LASTEXITCODE
          } catch {
            $collectionErrors.Add("Final status decision failed: $($_.ToString())")
            $statusExit = 1
          }
          $routeControlExit = if ($route -eq 'historical-pc53') { $precisionExit -eq '0' -and $precisionValidationExit -eq 0 } else {
            $correctedProbeExit -eq '0' -and $correctedValidationExit -eq 0
          }
          if ($statusExit -ne 0 -or $scalarExit -ne 0 -or -not $routeControlExit) {
            throw "Focused controls failed: route=$route gradle=$gradleExit precision=$precisionExit correctedProbe=$correctedProbeExit java=$javaExit scalar=$scalarExit collection=$collectionStatus validation=$validationStatus"
          }
      - name: Upload Windows collision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-collision-focus-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-collision-focus/
          if-no-files-found: error
