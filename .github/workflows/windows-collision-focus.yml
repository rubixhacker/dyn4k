name: Windows collision focus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-collision-focus:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify candidate revision
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne '${{ github.sha }}') {
            throw "Checkout revision mismatch: $actual"
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run focused native and pinned Java controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-collision-focus'
          $native = Join-Path $evidence 'native'
          $java = Join-Path $evidence 'java'
          New-Item -ItemType Directory -Force -Path $native, $java | Out-Null
          $gradleExit = $null
          $javaExit = -1
          $scalarExit = 1
          $collectionStatus = 0
          $validationStatus = 0
          $nativeStarted = $false
          $nativeLog = Join-Path $native 'gradle-console.log'
          $gradleExitFile = Join-Path $native 'gradle-exit-code.txt'
          $javaLog = Join-Path $java 'java-console.log'
          $javaExitFile = Join-Path $java 'java-exit-code.txt'
          $scalar = Join-Path $evidence 'scalar'
          $scalarLog = Join-Path $scalar 'scalar-control-console.log'
          $scalarStdout = Join-Path $scalar 'scalar-control-stdout.log'
          $scalarStderr = Join-Path $scalar 'scalar-control-stderr.log'
          $scalarExitFile = Join-Path $scalar 'scalar-exit-code.txt'
          $collectionErrors = [System.Collections.Generic.List[string]]::new()
          $results = Join-Path $PWD 'dyn4k-core/build/test-results/mingwX64Test'
          $xmlFiles = @()

          try {
            if (Test-Path $results) { Remove-Item -LiteralPath $results -Recurse -Force }
            $nativeStarted = $true
            & .\gradlew.bat :dyn4k-core:mingwX64Test `
              --tests 'org.dyn4j.collision.narrowphase.WindowsCollisionIntermediateDiagnosticTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CapsuleSliceTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CirclePolygonTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CircleSegmentTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CircleSliceTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.PolygonCapsuleTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.PolygonPolygonTest' `
              --no-daemon --rerun-tasks --console=plain 2>&1 | Tee-Object -FilePath $nativeLog
            $gradleExit = [string]$LASTEXITCODE
          } catch {
            try { $_ | Out-String | Add-Content -Path $nativeLog -ErrorAction Stop }
            catch {
              $collectionErrors.Add("Gradle console collection failed: $($_.ToString())")
              $collectionStatus = 1
            }
            if ($null -eq $gradleExit) {
              if ($nativeStarted -and $null -ne $LASTEXITCODE) {
                $gradleExit = [string]$LASTEXITCODE
              } else {
                $gradleExit = 'NOT_RUN'
              }
            }
          }
          if ($null -eq $gradleExit) { $gradleExit = 'NOT_RUN' }
          try {
            Set-Content -Path $gradleExitFile -Value $gradleExit
          } catch {
            $collectionErrors.Add("Gradle exit code record failed: $($_.ToString())")
            $collectionStatus = 1
          }

          try {
            if (-not $nativeStarted) { throw 'Native test command did not start after result cleanup.' }
            $xmlFiles = @(Get-ChildItem $results -Filter 'TEST-*.xml' -File -ErrorAction Stop)
          } catch {
            $collectionErrors.Add("Native XML listing failed: $($_.ToString())")
            $collectionStatus = 1
          }
          if ($null -ne $xmlFiles) {
            foreach ($file in $xmlFiles) {
              try {
                Copy-Item -LiteralPath $file.FullName -Destination $native -ErrorAction Stop
              } catch {
                $collectionErrors.Add("Native XML copy failed for $($file.Name): $($_.ToString())")
                $collectionStatus = 1
              }
            }
          }
          if ($xmlFiles.Count -ne 7) {
            $collectionErrors.Add("Expected seven same-run XML reports; found $($xmlFiles.Count)")
            $collectionStatus = 1
          }

          try {
            $jar = Join-Path $env:RUNNER_TEMP 'dyn4j-6.0.0.jar'
            Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/dyn4j/dyn4j/6.0.0/dyn4j-6.0.0.jar' -OutFile $jar
            $jarSha256 = (Get-FileHash -Algorithm SHA256 $jar).Hash.ToLowerInvariant()
            if ($jarSha256 -ne '204ca8dd55626ad3727b82dacb37df1800c5eff0d6bb6e782b6e5af5162b2b3e') {
              throw "Baseline JAR SHA-256 mismatch: $jarSha256"
            }
            $source = Join-Path $env:RUNNER_TEMP 'dyn4j-6.0.0-source'
            & git init $source
            if ($LASTEXITCODE -ne 0) { throw "Baseline source init failed: $LASTEXITCODE" }
            & git -C $source remote add origin https://github.com/dyn4j/dyn4j.git
            if ($LASTEXITCODE -ne 0) { throw "Baseline source remote failed: $LASTEXITCODE" }
            & git -C $source fetch --depth=1 origin 058bf6d982a0fb89b54050f929f6ea9dae53b714
            if ($LASTEXITCODE -ne 0) { throw "Baseline source fetch failed: $LASTEXITCODE" }
            & git -C $source checkout --quiet --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw "Baseline source checkout failed: $LASTEXITCODE" }
            $sourceRevision = (& git -C $source rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $sourceRevision -ne '058bf6d982a0fb89b54050f929f6ea9dae53b714') {
              throw "Baseline source revision mismatch: $sourceRevision"
            }
            Set-Content -Path (Join-Path $evidence 'baseline-source-revision.txt') -Value $sourceRevision
            & .\tools\diagnostic\windows_collision\run-java-control.ps1 `
              -JdkHome $env:JAVA_HOME -BaselineJar $jar `
              -BaselineSource $source -OutputDirectory $java `
              2>&1 | Tee-Object -FilePath $javaLog
            $javaExit = $LASTEXITCODE
          } catch {
            $javaError = $_.ToString()
            try { $_ | Out-String | Add-Content -Path $javaLog -ErrorAction Stop }
            catch {
              $collectionErrors.Add("Java console collection failed: $($_.ToString())")
              $collectionStatus = 1
            }
            $collectionErrors.Add("Pinned Java control failed: $javaError")
            $javaExit = 1
          } finally {
            try {
              Set-Content -Path $javaExitFile -Value $javaExit
            } catch {
              $collectionErrors.Add("Java exit code record failed: $($_.ToString())")
              $collectionStatus = 1
            }
          }

          try {
            New-Item -ItemType Directory -Force -Path $scalar | Out-Null
            $konanRoot = Join-Path $env:USERPROFILE '.konan'
            $konanDistributions = @(Get-ChildItem -LiteralPath $konanRoot -Directory -Filter 'kotlin-native-prebuilt-windows-x86_64-2.4.20' -ErrorAction Stop)
            if ($konanDistributions.Count -ne 1) {
              throw "Expected one installed Kotlin/Native 2.4.20 Windows distribution under $konanRoot; found $($konanDistributions.Count)"
            }
            $konancHome = $konanDistributions[0].FullName
            $konanc = Join-Path $konancHome 'bin/kotlinc-native.bat'
            if (-not (Test-Path -LiteralPath $konanc -PathType Leaf)) {
              throw "Kotlin/Native compiler is missing: $konanc"
            }
            $konancVersion = (& $konanc -version 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $konancVersion -notmatch '(?<![-A-Za-z0-9_~+/])2\.4\.20(?![-A-Za-z0-9_~+/]|\.[A-Za-z0-9])') {
              throw "Kotlin/Native version check failed: $konancVersion"
            }
            Set-Content -Path (Join-Path $scalar 'kotlin-native-version.txt') -Value $konancVersion
            $pwsh = Get-Command pwsh.exe -ErrorAction Stop
            & $pwsh.Source -NoProfile -File .\tools\diagnostic\windows_collision\run-scalar-control.ps1 `
              -KonancHome $konancHome -JdkHome $env:JAVA_HOME -BaselineJar $jar `
              -BaselineSource $source -OutputDirectory $scalar `
              1> $scalarStdout 2> $scalarStderr
            $scalarExit = $LASTEXITCODE
            if ($null -eq $scalarExit) { $scalarExit = 1 }
            @(
              "exit_code=$scalarExit"
              '--- stdout ---'
              Get-Content -LiteralPath $scalarStdout -ErrorAction SilentlyContinue
              '--- stderr ---'
              Get-Content -LiteralPath $scalarStderr -ErrorAction SilentlyContinue
            ) | Set-Content -Path $scalarLog
            Get-Content -LiteralPath $scalarLog
          } catch {
            try { $_ | Out-String | Add-Content -Path $scalarLog -ErrorAction Stop }
            catch {
              $collectionErrors.Add("Scalar control console collection failed: $($_.ToString())")
              $collectionStatus = 1
            }
            $scalarExit = 1
          } finally {
            try {
              Set-Content -Path $scalarExitFile -Value $scalarExit
            } catch {
              $collectionErrors.Add("Scalar control exit code record failed: $($_.ToString())")
              $collectionStatus = 1
            }
          }

          $scalarExecutable = Join-Path $scalar 'windows-collision-scalar.exe'
          if (Test-Path -LiteralPath $scalarExecutable -PathType Leaf) {
            try {
              $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
              $objdump = Get-Command llvm-objdump.exe, objdump.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -ne $dumpbin) {
                & $dumpbin.Source /imports $scalarExecutable 2>&1 |
                  Set-Content -Path (Join-Path $scalar 'native-imports.txt')
                Set-Content -Path (Join-Path $scalar 'native-imports-exit-code.txt') -Value $LASTEXITCODE
              } else {
                Set-Content -Path (Join-Path $scalar 'native-imports-status.txt') -Value 'UNAVAILABLE: dumpbin.exe not found'
              }
              if ($null -ne $objdump) {
                & $objdump.Source -d $scalarExecutable 2>&1 |
                  Set-Content -Path (Join-Path $scalar 'native-disassembly.txt')
                Set-Content -Path (Join-Path $scalar 'native-disassembly-exit-code.txt') -Value $LASTEXITCODE
              } else {
                Set-Content -Path (Join-Path $scalar 'native-disassembly-status.txt') -Value 'UNAVAILABLE: llvm-objdump.exe and objdump.exe not found'
              }
            } catch {
              $collectionErrors.Add("Optional native import or disassembly collection failed: $($_.ToString())")
              $collectionStatus = 1
            }
          } else {
            Set-Content -Path (Join-Path $scalar 'native-executable-status.txt') -Value 'UNAVAILABLE: scalar compiler did not produce an executable'
          }

          try {
            $javaTsv = Join-Path $java 'dyn4j-6.0.0-windows-control.tsv'
            $nativeTsv = Join-Path $native 'mingwX64-collision-diagnostics.tsv'
            $validationLog = Join-Path $evidence 'trace-validation.log'
            & python tools/compatibility/windows_collision_focus.py `
              validate --native-directory $native --java-tsv $javaTsv --native-tsv $nativeTsv `
              2>&1 | Tee-Object -FilePath $validationLog
            $validationExit = $LASTEXITCODE
            if ($validationExit -ne 0) {
              $collectionErrors.Add("Shared XML and TSV validation failed with exit $validationExit")
              $validationStatus = 1
            }
          } catch {
            $collectionErrors.Add("Shared XML and TSV validation could not run: $($_.ToString())")
            $validationStatus = 1
          }
          try {
            Set-Content -Path (Join-Path $evidence 'validation-status.txt') -Value $validationStatus
          } catch {
            $collectionErrors.Add("Validation status record failed: $($_.ToString())")
            $collectionStatus = 1
          }

          try {
            @(
              "candidate=$(git rev-parse HEAD)"
              "runner_os=$env:RUNNER_OS"
              "runner_arch=$env:RUNNER_ARCH"
              "image_os=$env:ImageOS"
              "image_version=$env:ImageVersion"
              "java_home=$env:JAVA_HOME"
              "java_version=$(& java -version 2>&1 | Select-Object -First 1)"
              "gradle_version=$(& .\gradlew.bat --version --console=plain | Select-String '^Gradle ' | Select-Object -First 1)"
              "powershell=$($PSVersionTable.PSVersion)"
            ) | Set-Content -Path (Join-Path $evidence 'runner-runtime-identity.txt')
          } catch {
            $collectionErrors.Add("Runner identity collection failed: $($_.ToString())")
            $collectionStatus = 1
          }

          $controlSources = @(
            'tools/diagnostic/windows_collision/WindowsCollisionScalarControl.kt'
            'tools/diagnostic/windows_collision/WindowsCollisionScalarJavaControl.java'
            'tools/diagnostic/windows_collision/run-scalar-control.ps1'
            'tools/diagnostic/windows_collision/validate-scalar-control.py'
            '.github/workflows/windows-collision-focus.yml'
          )
          $controlSourceHashes = [System.Collections.Generic.List[string]]::new()
          foreach ($relativeSource in $controlSources) {
            try {
              $sourcePath = Join-Path $PWD $relativeSource
              if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
                throw "Control source is missing: $relativeSource"
              }
              $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath -ErrorAction Stop).Hash.ToLowerInvariant()
              $controlSourceHashes.Add("$sourceHash  $relativeSource")
            } catch {
              $collectionErrors.Add("Control source hash failed for $relativeSource`: $($_.ToString())")
              $collectionStatus = 1
            }
          }
          try {
            $controlSourceHashes | Set-Content -Path (Join-Path $evidence 'control-source-sha256.txt') -ErrorAction Stop
          } catch {
            $collectionErrors.Add("Control source hash record failed: $($_.ToString())")
            $collectionStatus = 1
          }

          try {
            Set-Content -Path (Join-Path $evidence 'collection-status.txt') -Value $collectionStatus
          } catch {
            $collectionErrors.Add("Collection status record failed: $($_.ToString())")
            $collectionStatus = 1
          }
          if ($collectionErrors.Count -gt 0) {
            try {
              $collectionErrors | Set-Content -Path (Join-Path $evidence 'collection-errors.txt')
            } catch {
              $collectionStatus = 1
            }
          }
          $inventory = Join-Path $evidence 'sha256-inventory.txt'
          try {
            Get-ChildItem $evidence -Recurse -File -ErrorAction Stop | Where-Object FullName -ne $inventory |
              Sort-Object FullName | ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($evidence, $_.FullName)
                $hash = (Get-FileHash -Algorithm SHA256 $_.FullName -ErrorAction Stop).Hash.ToLowerInvariant()
                "$hash  $relative"
              } | Set-Content -Path $inventory
          } catch {
            $collectionErrors.Add("SHA-256 inventory failed: $($_.ToString())")
            $collectionStatus = 1
            try {
              $collectionErrors | Set-Content -Path (Join-Path $evidence 'collection-errors.txt') -ErrorAction Stop
              Set-Content -Path (Join-Path $evidence 'collection-status.txt') -Value $collectionStatus -ErrorAction Stop
              Set-Content -Path (Join-Path $evidence 'validation-status.txt') -Value $validationStatus -ErrorAction Stop
              Get-ChildItem $evidence -Recurse -File -ErrorAction Stop | Where-Object FullName -ne $inventory |
                Sort-Object FullName | ForEach-Object {
                  $relative = [IO.Path]::GetRelativePath($evidence, $_.FullName)
                  $hash = (Get-FileHash -Algorithm SHA256 $_.FullName -ErrorAction Stop).Hash.ToLowerInvariant()
                  "$hash  $relative"
                } | Set-Content -Path $inventory -ErrorAction Stop
            } catch {
              $collectionErrors.Add("SHA-256 inventory retry failed: $($_.ToString())")
              $collectionStatus = 1
              try {
                $collectionErrors | Set-Content -Path (Join-Path $evidence 'collection-errors.txt') -ErrorAction Stop
                Set-Content -Path (Join-Path $evidence 'collection-status.txt') -Value $collectionStatus -ErrorAction Stop
              } catch { }
            }
          }

          $statusLog = Join-Path $evidence 'final-status.log'
          $statusExit = 1
          try {
            & python tools/compatibility/windows_collision_focus.py status `
              --gradle-exit-code $gradleExit --java-exit-code $javaExit `
              --collection-status $collectionStatus --validation-status $validationStatus `
              2>&1 | Tee-Object -FilePath $statusLog
            $statusExit = $LASTEXITCODE
          } catch {
            $collectionErrors.Add("Final status decision failed: $($_.ToString())")
            $statusExit = 1
          }
          if ($statusExit -ne 0 -or $scalarExit -ne 0) {
            throw "Focused controls failed: gradle=$gradleExit java=$javaExit scalar=$scalarExit collection=$collectionStatus validation=$validationStatus"
          }
      - name: Upload Windows collision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-collision-focus-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-collision-focus/
          if-no-files-found: error
