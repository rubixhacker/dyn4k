name: Windows collision focus

on:
  workflow_dispatch:
    inputs:
      route:
        description: Focused evidence predicate
        required: true
        type: choice
        default: historical-pc53
        options:
          - historical-pc53
          - corrected-production

permissions:
  contents: read

jobs:
  windows-collision-focus:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify candidate revision
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne '${{ github.sha }}') {
            throw "Checkout revision mismatch: $actual"
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run focused native and pinned Java controls
        shell: pwsh
        timeout-minutes: 75
        env:
          DYN4K_COLLISION_ROUTE: ${{ inputs.route }}
        run: |
          & (Join-Path $PWD 'tools/diagnostic/windows_collision/run-focused-controls.ps1') -Route $env:DYN4K_COLLISION_ROUTE
      - name: Upload Windows collision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-collision-focus-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-collision-focus/
          if-no-files-found: error
