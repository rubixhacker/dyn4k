name: Windows collision focus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-collision-focus:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify candidate revision
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne '${{ github.sha }}') {
            throw "Checkout revision mismatch: $actual"
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run focused native and pinned Java controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-collision-focus'
          $native = Join-Path $evidence 'native'
          $java = Join-Path $evidence 'java'
          New-Item -ItemType Directory -Force -Path $native, $java | Out-Null
          $nativeExit = -1
          $javaExit = -1
          $nativeStarted = $false
          $nativeLog = Join-Path $native 'gradle-console.log'
          $nativeExitFile = Join-Path $native 'gradle-exit-code.txt'
          $javaLog = Join-Path $java 'java-console.log'
          $javaExitFile = Join-Path $java 'java-exit-code.txt'
          $nativeTsv = Join-Path $native 'mingwX64-collision-diagnostics.tsv'
          $collectionErrors = [System.Collections.Generic.List[string]]::new()
          $results = Join-Path $PWD 'dyn4k-core/build/test-results/mingwX64Test'

          try {
            if (Test-Path $results) { Remove-Item -LiteralPath $results -Recurse -Force }
            $nativeStarted = $true
            & .\gradlew.bat :dyn4k-core:mingwX64Test `
              --tests 'org.dyn4j.collision.narrowphase.WindowsCollisionIntermediateDiagnosticTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CapsuleSliceTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CirclePolygonTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CircleSegmentTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.CircleSliceTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.PolygonCapsuleTest' `
              --tests 'org.dyn4j.coverage.collision.shapes.a.PolygonPolygonTest' `
              --no-daemon --rerun-tasks --console=plain 2>&1 | Tee-Object -FilePath $nativeLog
            $nativeExit = $LASTEXITCODE
          } catch {
            $_ | Out-String | Add-Content -Path $nativeLog
            $nativeExit = 1
          }

          $expectedSuites = [ordered]@{
            'TEST-org.dyn4j.coverage.collision.shapes.a.CapsuleSliceTest.xml' = 'org.dyn4j.coverage.collision.shapes.a.CapsuleSliceTest'
            'TEST-org.dyn4j.coverage.collision.shapes.a.CirclePolygonTest.xml' = 'org.dyn4j.coverage.collision.shapes.a.CirclePolygonTest'
            'TEST-org.dyn4j.coverage.collision.shapes.a.CircleSegmentTest.xml' = 'org.dyn4j.coverage.collision.shapes.a.CircleSegmentTest'
            'TEST-org.dyn4j.coverage.collision.shapes.a.CircleSliceTest.xml' = 'org.dyn4j.coverage.collision.shapes.a.CircleSliceTest'
            'TEST-org.dyn4j.coverage.collision.shapes.a.PolygonCapsuleTest.xml' = 'org.dyn4j.coverage.collision.shapes.a.PolygonCapsuleTest'
            'TEST-org.dyn4j.coverage.collision.shapes.a.PolygonPolygonTest.xml' = 'org.dyn4j.coverage.collision.shapes.a.PolygonPolygonTest'
            'TEST-org.dyn4j.collision.narrowphase.WindowsCollisionIntermediateDiagnosticTest.xml' = 'org.dyn4j.collision.narrowphase.WindowsCollisionIntermediateDiagnosticTest'
          }
          $expectedDiagnosticCases = @('capsuleSlice[mingwX64]', 'circlePolygon[mingwX64]',
            'circleSegment[mingwX64]', 'circleSlice[mingwX64]', 'polygonCapsule[mingwX64]',
            'polygonPolygon[mingwX64]')
          $records = @()
          $xmlFiles = @()
          try {
            if (-not $nativeStarted) { throw 'Native test command did not start after result cleanup.' }
            $xmlFiles = @(Get-ChildItem $results -Filter 'TEST-*.xml' -File -ErrorAction Stop)
          } catch {
            $collectionErrors.Add("Native XML listing failed: $($_.ToString())")
          }
          if ($xmlFiles.Count -ne 7) {
            $collectionErrors.Add("Expected seven same-run XML files; found $($xmlFiles.Count)")
          }
          foreach ($file in $xmlFiles) {
            try {
              Copy-Item -LiteralPath $file.FullName -Destination $native -ErrorAction Stop
            } catch {
              $collectionErrors.Add("Native XML copy failed for $($file.Name): $($_.ToString())")
            }
          }
          foreach ($name in $expectedSuites.Keys) {
            $suiteFiles = @($xmlFiles | Where-Object Name -eq $name)
            if ($suiteFiles.Count -ne 1) {
              $collectionErrors.Add("Expected exactly one same-run suite report: $name")
              continue
            }
            try {
              [xml]$suiteXml = [IO.File]::ReadAllText($suiteFiles[0].FullName)
              if ($suiteXml.testsuite.name -ne $expectedSuites[$name]) {
                throw "Wrong suite identity: $($suiteXml.testsuite.name)"
              }
              if ($name -like '*WindowsCollisionIntermediateDiagnosticTest.xml') {
                $cases = @($suiteXml.testsuite.testcase | ForEach-Object name | Sort-Object)
                $expectedSorted = @($expectedDiagnosticCases | Sort-Object)
                if ($cases.Count -ne 6 -or (Compare-Object $expectedSorted $cases)) {
                  throw "Diagnostic suite must contain the six focused test cases; found $($cases.Count)"
                }
                $systemOutput = $suiteXml.SelectSingleNode('//system-out')
                if ($null -eq $systemOutput) { throw 'Diagnostic XML has no system-out trace.' }
                $records = @($systemOutput.InnerText -split "`r?`n" | Where-Object {
                  $_.StartsWith("DYN4K_COLLISION_DIAGNOSTIC`tv2`t", [StringComparison]::Ordinal)
                })
                if ($records.Count -ne 72) { throw "Expected 72 same-run native v2 records; found $($records.Count)" }
                [IO.File]::WriteAllLines($nativeTsv, [string[]]$records, [Text.UTF8Encoding]::new($false))
              }
            } catch {
              $collectionErrors.Add("Native XML read/validation failed for ${name}: $($_.ToString())")
            }
          }
          if ($collectionErrors.Count -gt 0) { $nativeExit = 1 }

          try {
            $jar = Join-Path $env:RUNNER_TEMP 'dyn4j-6.0.0.jar'
            Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/dyn4j/dyn4j/6.0.0/dyn4j-6.0.0.jar' -OutFile $jar
            $jarSha256 = (Get-FileHash -Algorithm SHA256 $jar).Hash.ToLowerInvariant()
            if ($jarSha256 -ne '204ca8dd55626ad3727b82dacb37df1800c5eff0d6bb6e782b6e5af5162b2b3e') {
              throw "Baseline JAR SHA-256 mismatch: $jarSha256"
            }
            $source = Join-Path $env:RUNNER_TEMP 'dyn4j-6.0.0-source'
            & git init $source
            if ($LASTEXITCODE -ne 0) { throw "Baseline source init failed: $LASTEXITCODE" }
            & git -C $source remote add origin https://github.com/dyn4j/dyn4j.git
            if ($LASTEXITCODE -ne 0) { throw "Baseline source remote failed: $LASTEXITCODE" }
            & git -C $source fetch --depth=1 origin 058bf6d982a0fb89b54050f929f6ea9dae53b714
            if ($LASTEXITCODE -ne 0) { throw "Baseline source fetch failed: $LASTEXITCODE" }
            & git -C $source checkout --quiet --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw "Baseline source checkout failed: $LASTEXITCODE" }
            $sourceRevision = (& git -C $source rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $sourceRevision -ne '058bf6d982a0fb89b54050f929f6ea9dae53b714') {
              throw "Baseline source revision mismatch: $sourceRevision"
            }
            Set-Content -Path (Join-Path $evidence 'baseline-source-revision.txt') -Value $sourceRevision
            & .\tools\diagnostic\windows_collision\run-java-control.ps1 `
              -JdkHome $env:JAVA_HOME -BaselineJar $jar `
              -BaselineSource $source -OutputDirectory $java `
              2>&1 | Tee-Object -FilePath $javaLog
            $javaExit = $LASTEXITCODE
          } catch {
            $_ | Out-String | Add-Content -Path $javaLog
            $javaExit = 1
          } finally {
            Set-Content -Path $javaExitFile -Value $javaExit
          }

          try {
            $javaTsv = Join-Path $java 'dyn4j-6.0.0-windows-control.tsv'
            if (-not (Test-Path -LiteralPath $javaTsv -PathType Leaf)) {
              throw 'Pinned Java control TSV is missing.'
            }
            $javaRecords = @(Select-String -LiteralPath $javaTsv `
              -Pattern '^DYN4K_COLLISION_DIAGNOSTIC\tv2\t' -ErrorAction Stop | ForEach-Object Line)
            if ($javaRecords.Count -ne 72) { throw "Expected 72 Java v2 records; found $($javaRecords.Count)" }
            if ($records.Count -ne 72) { throw 'Cannot compare identities without 72 native records.' }
            $nativeKeys = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $javaKeys = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            foreach ($record in $records) {
              if ($record -notmatch '^DYN4K_COLLISION_DIAGNOSTIC\tv2\tprovider=dyn4k\t') {
                throw 'Malformed native v2 record or wrong provider.'
              }
              $match = [regex]::Match($record, '\tfixture=([^\t]+)\tmethod=([^\t]+)\tphase=([^\t]+)\torder=([^\t]+)\tstep=([^\t]+)\talgorithm=([^\t]+)')
              if (-not $match.Success) { throw 'Malformed native v2 identity.' }
              $key = @($match.Groups[1].Value, $match.Groups[2].Value,
                $match.Groups[3].Value, $match.Groups[4].Value,
                $match.Groups[5].Value, $match.Groups[6].Value) -join "`t"
              if (-not $nativeKeys.Add($key)) { throw "Duplicate native identity: $key" }
            }
            foreach ($record in $javaRecords) {
              if ($record -notmatch '^DYN4K_COLLISION_DIAGNOSTIC\tv2\tprovider=dyn4j-6\.0\.0\t') {
                throw 'Malformed Java v2 record or wrong provider.'
              }
              $match = [regex]::Match($record, '\tfixture=([^\t]+)\tmethod=([^\t]+)\tphase=([^\t]+)\torder=([^\t]+)\tstep=([^\t]+)\talgorithm=([^\t]+)')
              if (-not $match.Success) { throw 'Malformed Java v2 identity.' }
              $key = @($match.Groups[1].Value, $match.Groups[2].Value,
                $match.Groups[3].Value, $match.Groups[4].Value,
                $match.Groups[5].Value, $match.Groups[6].Value) -join "`t"
              if (-not $javaKeys.Add($key)) { throw "Duplicate Java identity: $key" }
            }
            if ($nativeKeys.Count -ne 72 -or $javaKeys.Count -ne 72 -or
                @($nativeKeys | Where-Object { -not $javaKeys.Contains($_) }).Count -ne 0 -or
                @($javaKeys | Where-Object { -not $nativeKeys.Contains($_) }).Count -ne 0) {
              throw 'Native and Java v2 identity sets do not match exactly.'
            }
          } catch {
            $collectionErrors.Add("Trace validation failed: $($_.ToString())")
            $nativeExit = 1
          }

          try {
            @(
              "candidate=$(git rev-parse HEAD)"
              "runner_os=$env:RUNNER_OS"
              "runner_arch=$env:RUNNER_ARCH"
              "image_os=$env:ImageOS"
              "image_version=$env:ImageVersion"
              "java_home=$env:JAVA_HOME"
              "java_version=$(& java -version 2>&1 | Select-Object -First 1)"
              "gradle_version=$(& .\gradlew.bat --version --console=plain | Select-String '^Gradle ' | Select-Object -First 1)"
              "powershell=$($PSVersionTable.PSVersion)"
            ) | Set-Content -Path (Join-Path $evidence 'runner-runtime-identity.txt')
          } catch {
            $collectionErrors.Add("Runner identity collection failed: $($_.ToString())")
          }

          Set-Content -Path $nativeExitFile -Value $nativeExit
          if ($collectionErrors.Count -gt 0) {
            $collectionErrors | Set-Content -Path (Join-Path $evidence 'collection-errors.txt')
          }
          $inventory = Join-Path $evidence 'sha256-inventory.txt'
          try {
            Get-ChildItem $evidence -Recurse -File -ErrorAction Stop | Where-Object FullName -ne $inventory |
              Sort-Object FullName | ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($evidence, $_.FullName)
                $hash = (Get-FileHash -Algorithm SHA256 $_.FullName -ErrorAction Stop).Hash.ToLowerInvariant()
                "$hash  $relative"
              } | Set-Content -Path $inventory
          } catch {
            $collectionErrors.Add("SHA-256 inventory failed: $($_.ToString())")
            $collectionErrors | Set-Content -Path (Join-Path $evidence 'collection-errors.txt')
            $nativeExit = 1
            Set-Content -Path $nativeExitFile -Value $nativeExit
          }

          if ($nativeExit -ne 0 -or $javaExit -ne 0 -or $collectionErrors.Count -gt 0) {
            throw "Focused controls failed: native=$nativeExit java=$javaExit"
          }
      - name: Upload Windows collision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-collision-focus-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-collision-focus/
          if-no-files-found: error
