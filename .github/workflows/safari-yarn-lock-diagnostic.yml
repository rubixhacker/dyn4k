name: Safari Yarn lock diagnostic

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed candidate commit SHA
        required: true
        type: string
      configuration:
        description: Full-hosted Safari source configuration
        required: true
        default: development
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SAFARI_BIN: ${{ github.workspace }}/tools/qualification/safari-launch.sh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Select pinned Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Capture source Kotlin/JS lock generation
        env:
          DYN4K_SAFARI_LAUNCH_CONTEXT: ${{ runner.temp }}/safari-launch-context-raw
        run: >-
          python tools/qualification/safari_yarn_lock.py
          --candidate-sha "${{ inputs.candidate_sha }}"
          --configuration "${{ inputs.configuration }}"
          --output "${{ runner.temp }}/safari-yarn-lock-diagnostic"
      - name: Audit captured mismatch bytes
        run: |
          if python -c 'import json,sys; sys.exit(json.load(open(sys.argv[1]))["status"] != "LOCK_MISMATCH_CAPTURED")' \
              "${{ runner.temp }}/safari-yarn-lock-diagnostic/receipt.json"; then
            python tools/qualification/safari_yarn_lock.py \
              --candidate-sha "${{ inputs.candidate_sha }}" \
              --output "${{ runner.temp }}/safari-yarn-lock-diagnostic" --audit
          fi
      - name: Capture Safari host and Karma context
        if: always()
        shell: bash
        run: |
          raw="$RUNNER_TEMP/safari-launch-context-raw"
          context="$RUNNER_TEMP/safari-launch-context"
          mkdir -p "$raw"
          session_exit=0
          process_exit=0
          /bin/launchctl managername > "$raw/session-after.txt" 2>&1 || session_exit=$?
          /bin/ps -axo pid,ppid,state,comm > "$raw/process-after.txt" 2>&1 || process_exit=$?
          printf 'session_exit=%s\nprocess_exit=%s\n' "$session_exit" "$process_exit" > "$raw/host-outcome.txt"
          python tools/qualification/safari_yarn_lock.py \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --input-context "$raw" --output "$context" --capture-context
      - name: Retain raw lock diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-yarn-lock-${{ inputs.candidate_sha }}-${{ inputs.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safari-yarn-lock-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain Safari launch context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-launch-context-${{ inputs.candidate_sha }}-${{ inputs.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safari-launch-context/
          include-hidden-files: true
          if-no-files-found: error
