name: Qualification workflow source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-source-contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        id: java-setup
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Reject hosted macOS routes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./gradlew -p tools/harness :qualification:guardHostedRunners --console=plain -q
      - name: Test qualification workflow contracts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 -B -m unittest tools.compatibility.test_qualification_workflow
      - name: Test declaration ledger contracts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: env -u OLLAMA_API_KEY -u DYN4K_BASELINE_SOURCE -u DYN4K_BASELINE_JAR -u DYN4K_BASELINE_SOURCES_JAR PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools/compatibility python3 -B -m unittest -v test_ledger
      - name: Verify pinned GNU MPFR runtime
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: env -u OLLAMA_API_KEY PYTHONPATH=tools/numerical/portable python3 -B -c 'from rotation_oracle import _MPFR; mpfr = _MPFR(); print("GNU MPFR", mpfr.version)'
      - name: Test portable Java banner controls
        id: java-banner-units
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: env -u OLLAMA_API_KEY PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools/compatibility python3 -B -m unittest -v test_governing_seams.GoverningSeamsTests.test_java_options_keep_the_inherited_route_for_both_providers test_governing_seams.GoverningSeamsTests.test_only_one_exact_java_options_banner_is_removed
      - name: Test source-only numerical regressions including bounded live-process tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.java-setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          source_checks_tmp="$(realpath "$(mktemp -d "$HOME/d4t.XXXXXX")")"
          test -d "$source_checks_tmp"
          test "$(stat -c %a "$source_checks_tmp")" = 700
          test "$(stat -c %u "$source_checks_tmp")" = "$(id -u)"
          test "${#source_checks_tmp}" -le 40
          export TMPDIR="$source_checks_tmp"
          env -u OLLAMA_API_KEY \
            -u DYN4K_JDI_JDK_HOME \
            -u DYN4K_JDI_RETAINED_JAR \
            -u DYN4K_WHEEL_ARCHIVE \
            -u DYN4K_WHEEL_ORIGIN \
            -u DYN4K_GEOMETRY_BASELINE \
            -u DYN4K_PROSPECTIVE_CURRENT_MANIFEST \
            -u DYN4K_PROSPECTIVE_HISTORICAL_MANIFEST \
            -u DYN4K_BOOLEAN_REFERENCE_ORIGIN \
            -u DYN4K_BOOLEAN_JDI_TOY \
            -u BOOLEAN_JDI_TOY_ROOT \
            -u DYN4K_PULLEY_BASELINE_JAR \
            -u DYN4K_PULLEY_LOADED_CODE_ROOT \
            -u DYN4K_PULLEY_CANDIDATE_JAR \
            -u DYN4K_PULLEY_REAL_CLASSPATH \
            -u DYN4K_PULLEY_CACHE_ROOT \
            -u ANDROID_SDK_ROOT \
            DYN4K_TEST_JDK8_HOME="$JAVA_HOME_8_X64" \
            PYTHONPATH=tools/numerical/portable:tools/numerical/portable/boolean_rotation_jdi \
            python3 -B -m unittest -v \
              test_actual_arithmetic \
              test_actual_capture_receipt \
              test_actual_capture_v6 \
              test_actual_trace \
              test_ordinary_arithmetic_diagnostic \
              ordinary_snapshot.test_control \
              test_capture_actual \
              test_rotation_oracle \
              test_rotation_marker \
              test_prospective_compare \
              test_witness \
              test_source_guard \
              test_jdi_bridge \
              test_pulley_jdi_v1 \
              test_pulley_jdi_v2 \
              test_pulley_jdi_classpath_v2 \
              test_external_rotation_binding \
              test_numeric_producer \
              test_run
      - name: Test bounded JDI wait on JDK 21
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.java-setup.outcome == 'success' }}
        run: |
          test -n "${JAVA_HOME_21_X64:-}"
          test -x "$JAVA_HOME_21_X64/bin/java"
          test -x "$JAVA_HOME_21_X64/bin/javac"
          test -n "${JAVA_HOME_8_X64:-}"
          test -x "$JAVA_HOME_8_X64/bin/java"
          test -x "$JAVA_HOME_8_X64/bin/javac"
          "$JAVA_HOME_8_X64/bin/java" -version 2>&1 | grep -Eq 'version "1\.8\.'
          "$JAVA_HOME_8_X64/bin/javac" -version 2>&1 | grep -Eq '^javac 1\.8\.'
          "$JAVA_HOME_21_X64/bin/java" -version 2>&1 | grep -Eq 'version "21\.'
          command -v strace
          env -u OLLAMA_API_KEY \
            DYN4K_JDI_JDK_HOME="$JAVA_HOME_21_X64" \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=tools/numerical/portable/boolean_rotation_jdi \
            python3 -B -m unittest -v test_jdi_wait
      - name: Test numeric class witness on JDK 21
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.java-setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          unset OLLAMA_API_KEY
          export TMPDIR="$HOME/d4tmp"
          mkdir -p "$TMPDIR"
          chmod 700 "$TMPDIR"
          test "${#TMPDIR}" -le 40
          export JAVA_TOOL_OPTIONS="-XX:-UsePerfData -Djava.io.tmpdir=$TMPDIR"
          test -n "${JAVA_HOME_21_X64:-}"
          test -d "$JAVA_HOME_21_X64"
          test -x "$JAVA_HOME_21_X64/bin/java"
          test -x "$JAVA_HOME_21_X64/bin/javac"
          "$JAVA_HOME_21_X64/bin/java" -version 2>&1 | grep -Eq 'version "21\.'
          "$JAVA_HOME_21_X64/bin/javac" -version 2>&1 | grep -Eq '^javac 21\.'
          command -v strace
          env -u OLLAMA_API_KEY \
            DYN4K_CLASS_WITNESS_JDK_HOME="$JAVA_HOME_21_X64" \
            DYN4K_JDI_JDK_HOME="$JAVA_HOME_21_X64" \
            DYN4K_TEST_JDK8_HOME="$JAVA_HOME_8_X64" \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=tools/numerical/portable \
            python3 -B -m unittest -v test_numeric_class_witness
      - name: Test qualification manifest and publication contracts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: env -u OLLAMA_API_KEY PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools/qualification python3 -B -m unittest -v test_full_suite_manifest
      - name: Test independent qualification gate seams
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: env -u OLLAMA_API_KEY PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools/qualification python3 -B -m unittest -v test_independent_gates
      - name: Test portable qualification source modules
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: env -u OLLAMA_API_KEY -u DYN4K_UPSTREAM_SOURCE -u DYN4K_RETAINED_FULL_JVM_ARCHIVE -u DYN4K_JVM_MODE_PUBLICATION -u DYN4K_RETAINED_BROWSER_PRODUCER -u DYN4K_RETAINED_BROWSER_ARCHIVES PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools/qualification python3 -B -m unittest -v test_compiler_modes test_full_corpus test_node_runtime_binding test_independent_adapter test_full_native_host_consumer
      - name: Check migration guide links and claims
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: env -u OLLAMA_API_KEY PYTHONDONTWRITEBYTECODE=1 python3 -B docs/guide/check_links.py
      - name: Test migration guide checks
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: env -u OLLAMA_API_KEY PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=docs/guide python3 -B -m unittest -v test_checks
      - name: Install migration image decoder
        id: imagemagick-setup
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends imagemagick
      - name: Test migration scene validators
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.imagemagick-setup.outcome == 'success' }}
        run: env -u OLLAMA_API_KEY PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v tools.migration.test_truck_camera tools.migration.test_validation
