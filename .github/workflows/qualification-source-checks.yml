name: Qualification workflow source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-source-contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject hosted macOS routes
        run: python3 -B tools/qualification/guard_hosted_runners.py
      - name: Test qualification workflow contracts
        run: python3 -B -m unittest tools.compatibility.test_qualification_workflow
      - name: Test hosted runner guard
        run: PYTHONPATH=tools/qualification python3 -B -m unittest test_guard_hosted_runners
      - name: Verify pinned GNU MPFR runtime
        run: env -u OLLAMA_API_KEY PYTHONPATH=tools/numerical/portable python3 -B -c 'from rotation_oracle import _MPFR; mpfr = _MPFR(); print("GNU MPFR", mpfr.version)'
      - name: Test source-only numerical regressions
        run: |
          env -u OLLAMA_API_KEY \
            -u DYN4K_JDI_JDK_HOME \
            -u DYN4K_JDI_RETAINED_JAR \
            -u DYN4K_WHEEL_ARCHIVE \
            -u DYN4K_WHEEL_ORIGIN \
            -u DYN4K_GEOMETRY_BASELINE \
            -u DYN4K_PROSPECTIVE_CURRENT_MANIFEST \
            -u DYN4K_PROSPECTIVE_HISTORICAL_MANIFEST \
            -u DYN4K_BOOLEAN_REFERENCE_ORIGIN \
            -u DYN4K_BOOLEAN_JDI_TOY \
            -u BOOLEAN_JDI_TOY_ROOT \
            -u DYN4K_PULLEY_BASELINE_JAR \
            -u DYN4K_PULLEY_LOADED_CODE_ROOT \
            -u DYN4K_PULLEY_CANDIDATE_JAR \
            -u DYN4K_PULLEY_REAL_CLASSPATH \
            -u DYN4K_PULLEY_CACHE_ROOT \
            PYTHONPATH=tools/numerical/portable:tools/numerical/portable/boolean_rotation_jdi \
            python3 -B -m unittest -v \
              test_actual_arithmetic \
              test_actual_capture_receipt \
              test_capture_actual \
              test_rotation_oracle \
              test_rotation_marker \
              test_prospective_compare \
              test_witness \
              test_source_guard \
              test_jdi_bridge \
              test_pulley_jdi_v1 \
              test_pulley_jdi_v2 \
              test_pulley_jdi_classpath_v2 \
              test_external_rotation_binding
      - name: Test bounded JDI wait on JDK 21
        run: |
          test -n "${JAVA_HOME_21_X64:-}"
          test -x "$JAVA_HOME_21_X64/bin/java"
          test -x "$JAVA_HOME_21_X64/bin/javac"
          "$JAVA_HOME_21_X64/bin/java" -version 2>&1 | grep -Eq 'version "21\.'
          command -v strace
          env -u OLLAMA_API_KEY \
            DYN4K_JDI_JDK_HOME="$JAVA_HOME_21_X64" \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=tools/numerical/portable/boolean_rotation_jdi \
            python3 -B -m unittest -v test_jdi_wait
      - name: Test qualification manifest and publication contracts
        run: env -u OLLAMA_API_KEY PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools/qualification python3 -B -m unittest -v test_full_suite_manifest test_publication
      - name: Test independent qualification gate seams
        run: env -u OLLAMA_API_KEY PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools/qualification python3 -B -m unittest -v test_independent_gates
      - name: Check migration guide links and claims
        run: env -u OLLAMA_API_KEY PYTHONDONTWRITEBYTECODE=1 python3 -B docs/guide/check_links.py
      - name: Test migration guide checks
        run: env -u OLLAMA_API_KEY PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=docs/guide python3 -B -m unittest -v test_checks
