# Harness detekt configuration.
#
# The default rule set applies (`buildUponDefaultConfig = true` in the root build);
# this file only adjusts the runner. Rule changes belong here, one at a time, with
# a reason. Existing debt lives in each module's `baseline.xml`, which records the
# finding instead of fixing it; new code must come back clean.
#
# Disabled rules, with reasons. Every one below conflicts with the port's structure,
# not with its quality: verifiers mirror Python reference functions branch for
# branch so vectors stay byte-identical, and splitting them risks divergence.
# What remains active (unused symbols, swallowed exceptions, line length,
# declaration names, and the rest of the default set) still fails the build.
complexity:
  LongMethod:
    active: false
  CyclomaticComplexMethod:
    active: false
  ComplexCondition:
    active: false
  LongParameterList:
    active: false
  NestedBlockDepth:
    active: false
  TooManyFunctions:
    active: false
  LargeClass:
    active: false
style:
  # Ports carry reference literals (counts, lengths, digests); naming them would
  # obscure the one-to-one mapping with the Python they reproduce.
  MagicNumber:
    active: false
  # Explicit `throw IllegalArgumentException` mirrors the reference `raise` sites
  # for parity review; `require` would hide that mapping.
  UseRequire:
    active: false
  # Verifiers return early and throw per rejected shape, by design.
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false
  # Ports carry long reference literals, regular expressions, and golden vectors;
  # wrapping them would obscure parity. Indentation and spacing stay with ktlint.
  MaxLineLength:
    active: false
potential-bugs:
  # Detekt 1.23 reads this tree with an older Kotlin compiler than the build uses,
  # and flags reachable code (for example statements inside `buildSet`) as
  # unreachable. Revisit on a detekt upgrade; until then the rule is noise.
  UnreachableCode:
    active: false
build:
  maxIssues: 0
  excludeCorrectable: false
config:
  validation: true
processors:
  active: true
  exclude:
    - 'DetektProgressListener'
console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
output-reports:
  active: false
